<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0602" />
      <stop offset="50%" stop-color="#1A0D04" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <pattern id="mv-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3D200A" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <filter id="mv-glow">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="mv-laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <style>
      @keyframes pulseVoice { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes eqM1 { 0%, 100% { height: 10px; y: 35px; } 50% { height: 35px; y: 10px; } }
      @keyframes eqM2 { 0%, 100% { height: 30px; y: 15px; } 50% { height: 12px; y: 33px; } }
      @keyframes eqM3 { 0%, 100% { height: 18px; y: 27px; } 50% { height: 40px; y: 5px; } }
      @keyframes waveM { 0% { stroke-dashoffset: 120; } 100% { stroke-dashoffset: 0; } }
      @keyframes mScanVoice {
        0%, 42.8% { transform: translateY(-30px); opacity: 0; }
        42.9% { transform: translateY(-10px); opacity: 1; }
        57.6% { transform: translateY(295px); opacity: 1; }
        58.6% { transform: translateY(320px); opacity: 0; }
        58.7%, 100% { transform: translateY(-30px); opacity: 0; }
      }

      .live-dot-voice { animation: pulseVoice 2s infinite ease-in-out; }
      .bar-m-1 { animation: eqM1 0.7s infinite ease-in-out; }
      .bar-m-2 { animation: eqM2 0.5s infinite ease-in-out; }
      .bar-m-3 { animation: eqM3 0.9s infinite ease-in-out; }
      .wave-m { stroke-dasharray: 6, 4; animation: waveM 2s linear infinite; }
      .m-scan-beam-voice { animation: mScanVoice 8s linear infinite; }
    </style>
  </defs>

  <rect width="480" height="320" rx="8" fill="url(#mv-bg)" stroke="#F59E0B" stroke-width="1.4" />
  <rect width="480" height="320" rx="8" fill="url(#mv-grid)" />

  <!-- Content -->
  <g transform="translate(18, 30)">
    <text font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">
      🎙️ THE VOICE
    </text>

    <!-- Difficulty Badge -->
    <g transform="translate(150, -15)">
      <rect width="64" height="18" rx="2" fill="#2E1C0A" />
      <text x="5" y="13" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#94A3B8">DIFFICULTY</text>
      <rect x="64" y="0" width="105" height="18" rx="2" fill="#D97706" />
      <text x="70" y="13" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#FFFFFF">WHY IS IT LAGGING</text>
    </g>

    <!-- Status Chip -->
    <g transform="translate(335, -15)">
      <rect width="102" height="18" rx="9" fill="#241406" stroke="#F59E0B" stroke-width="0.8" />
      <circle cx="10" cy="9" r="3" fill="#FBBF24" class="live-dot-voice" />
      <text x="18" y="13" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#FDE68A">VOICE TRAINED</text>
    </g>
  </g>

  <text x="18" y="62" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#FB923C">
    Real-Time Voice AI, Custom TTS Training &amp; Neural Audio
  </text>

  <g transform="translate(18, 84)" font-family="'JetBrains Mono', monospace" font-size="10.8" fill="#94A3B8">
    <text y="0">Trained neural voices with <tspan fill="#F8FAFC" font-weight="700">sub-100ms turn-around</tspan>.</text>
    <text y="18">Full-duplex WebRTC streaming, acoustic cloning &amp; STT.</text>
    <text y="36">Waiting 3 seconds for a reply is a personality flaw.</text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(18, 140)">
    <rect x="0" y="0" width="94" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="7" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">TTS Training</text>

    <rect x="100" y="0" width="86" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="107" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Stream TTS</text>

    <rect x="192" y="0" width="92" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="199" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">LiveKit/WebRTC</text>

    <rect x="290" y="0" width="84" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="297" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Voice Clone</text>

    <rect x="380" y="0" width="60" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="387" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Barge-in</text>
  </g>

  <line x1="18" y1="172" x2="462" y2="172" stroke="#3D200A" stroke-width="1" />

  <!-- Animated Oscilloscope for Mobile -->
  <g transform="translate(18, 185)">
    <rect width="444" height="85" rx="6" fill="#0A0401" stroke="#2E1706" stroke-width="1" />

    <!-- EQ Bars -->
    <g transform="translate(20, 15)">
      <rect x="0" y="20" width="6" height="25" rx="1.5" fill="#F59E0B" class="bar-m-1" />
      <rect x="10" y="10" width="6" height="35" rx="1.5" fill="#FBBF24" class="bar-m-2" />
      <rect x="20" y="25" width="6" height="20" rx="1.5" fill="#D97706" class="bar-m-3" />
      <rect x="30" y="5" width="6" height="40" rx="1.5" fill="#FBBF24" class="bar-m-1" />
      <rect x="40" y="18" width="6" height="27" rx="1.5" fill="#F59E0B" class="bar-m-2" />
      <rect x="50" y="12" width="6" height="33" rx="1.5" fill="#FDE68A" class="bar-m-3" />
      <rect x="60" y="28" width="6" height="17" rx="1.5" fill="#D97706" class="bar-m-1" />
      <rect x="70" y="8" width="6" height="37" rx="1.5" fill="#FBBF24" class="bar-m-2" />
    </g>

    <!-- Streaming Sine Wave -->
    <path d="M 120 42 Q 145 20 170 42 T 220 42 T 270 42 T 320 42 T 370 42 T 420 42" fill="none" stroke="#FBBF24" stroke-width="1.8" filter="url(#mv-glow)" class="wave-m" />

    <text x="390" y="65" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FDE68A">PING: 84MS</text>
  </g>

  <!-- Quest & Telemetry -->
  <g transform="translate(18, 285)">
    <rect width="155" height="24" rx="4" fill="#241406" stroke="#F59E0B" stroke-width="0.9" />
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FBBF24">
      QUEST: MAKE IT TALK
    </text>
    <text x="450" y="12" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#F59E0B">
      TTS: TRAINED CUSTOM NEURAL
    </text>
    <text x="450" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">
      STREAM: FULL-DUPLEX &lt;100MS
    </text>
  </g>

  <!-- Global Mobile Scanline Beam Segment (42.9% to 58.6%) -->
  <g class="m-scan-beam-voice" pointer-events="none">
    <rect width="480" height="24" fill="url(#mv-laser-beam)" />
    <line x1="0" y1="24" x2="480" y2="24" stroke="#FBBF24" stroke-width="2" filter="url(#mv-glow)" />
    <line x1="0" y1="23" x2="480" y2="23" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
