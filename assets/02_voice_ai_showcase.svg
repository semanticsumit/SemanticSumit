<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="v-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05020D" />
      <stop offset="50%" stop-color="#0D071E" />
      <stop offset="100%" stop-color="#05020C" />
    </linearGradient>

    <filter id="v-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="v-scope-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#052E16" stroke-width="0.7" />
    </pattern>

    <style>
      @keyframes photonFlow {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(130px); opacity: 0; }
      }
      @keyframes osciScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes vuL { 0%, 100% { height: 18px; } 35% { height: 65px; } 75% { height: 35px; } }
      @keyframes vuR { 0%, 100% { height: 42px; } 45% { height: 22px; } 85% { height: 72px; } }
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

      .photon { animation: photonFlow 1.4s linear infinite; }
      .wave { stroke-dasharray: 600; animation: osciScroll 2.8s linear infinite; }
      .vu-l { animation: vuL 0.75s infinite; }
      .vu-r { animation: vuR 0.85s infinite; }
      .p-dot { animation: pulseDot 1.2s infinite; }
    </style>
  </defs>

  <!-- Frame: Flat top and bottom for seamless zero-gap docking -->
  <rect width="1200" height="360" fill="url(#v-bg)" stroke="#2B144E" stroke-width="1.8" />

  <!-- SECTION HEADER -->
  <g transform="translate(48, 28)">
    <circle cx="0" cy="0" r="4.5" fill="#00F0FF" class="p-dot" />
    <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#00F0FF" letter-spacing="1.5">
      REAL-TIME VOICE AI STREAMING PIPELINE // GLASS-TO-GLASS ARCHITECTURE
    </text>
    <text x="730" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A855F7">
      PROTOCOL: WEBRTC FULL-DUPLEX // MAYA-1 TTS // OPUS 48kHz
    </text>
    <rect x="1045" y="-8" width="65" height="20" rx="4" fill="#052E16" stroke="#39FF14" stroke-width="0.8" />
    <text x="1055" y="6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#39FF14">● ONLINE</text>
    <line x1="-10" y1="16" x2="1115" y2="16" stroke="#251642" stroke-width="1.2" />
  </g>

  <!-- ================= 4 PIPELINE NODES ================= -->
  <!-- Conduits -->
  <g stroke="#00F0FF" stroke-width="2" opacity="0.6">
    <line x1="285" y1="110" x2="385" y2="110" stroke-dasharray="6,4" />
    <line x1="575" y1="110" x2="675" y2="110" stroke="#A855F7" stroke-dasharray="6,4" />
    <line x1="865" y1="110" x2="965" y2="110" stroke="#EC4899" stroke-dasharray="6,4" />
  </g>
  <!-- Photons -->
  <g transform="translate(285, 110)"><circle cx="0" cy="0" r="4" fill="#00F0FF" class="photon" filter="url(#v-glow)" /></g>
  <g transform="translate(575, 110)"><circle cx="0" cy="0" r="4" fill="#A855F7" class="photon" filter="url(#v-glow)" /></g>
  <g transform="translate(865, 110)"><circle cx="0" cy="0" r="4" fill="#EC4899" class="photon" filter="url(#v-glow)" /></g>

  <!-- Node 1: Ingest -->
  <g transform="translate(60, 55)">
    <rect width="225" height="105" rx="8" fill="#090516" stroke="#00F0FF" stroke-width="1.2" />
    <rect width="225" height="22" rx="8" fill="#120A28" />
    <path d="M 0 16 L 0 22 L 225 22 L 225 16 Z" fill="#120A28" />
    <text x="14" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00F0FF">01 // WEBRTC INGEST</text>
    
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#F8FAFC">Opus 48kHz Stream</text>
    <text x="14" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Zero-buffer chunk receiver</text>
    
    <rect x="14" y="80" width="197" height="16" rx="3" fill="#052E16" />
    <text x="70" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#39FF14">INGEST: ~12ms</text>
  </g>

  <!-- Node 2: STT -->
  <g transform="translate(350, 55)">
    <rect width="225" height="105" rx="8" fill="#090516" stroke="#3B82F6" stroke-width="1.2" />
    <rect width="225" height="22" rx="8" fill="#0E1234" />
    <path d="M 0 16 L 0 22 L 225 22 L 225 16 Z" fill="#0E1234" />
    <text x="14" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60A5FA">02 // STREAMING STT</text>
    
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#F8FAFC">Streaming Whisper</text>
    <text x="14" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">VAD + Chunked Token Stream</text>
    
    <rect x="14" y="80" width="197" height="16" rx="3" fill="#172554" />
    <text x="75" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#60A5FA">TTFT: ~32ms</text>
  </g>

  <!-- Node 3: LLM Agent -->
  <g transform="translate(640, 55)">
    <rect width="225" height="105" rx="8" fill="#090516" stroke="#A855F7" stroke-width="1.2" />
    <rect width="225" height="22" rx="8" fill="#1C0D34" />
    <path d="M 0 16 L 0 22 L 225 22 L 225 16 Z" fill="#1C0D34" />
    <text x="14" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#D8B4FE">03 // COGNITIVE CORE</text>
    
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#F8FAFC">Reasoning &amp; RAG</text>
    <text x="14" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Tool Use + Dynamic Turn-taking</text>
    
    <rect x="14" y="80" width="197" height="16" rx="3" fill="#3B0764" />
    <text x="65" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#D8B4FE">LLM-TTFT: ~38ms</text>
  </g>

  <!-- Node 4: Maya-1 TTS -->
  <g transform="translate(930, 55)">
    <rect width="225" height="105" rx="8" fill="#090516" stroke="#EC4899" stroke-width="1.2" />
    <rect width="225" height="22" rx="8" fill="#280B22" />
    <path d="M 0 16 L 0 22 L 225 22 L 225 16 Z" fill="#280B22" />
    <text x="14" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F472B6">04 // MAYA-1 TTS</text>
    
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#F8FAFC">Streaming Synth</text>
    <text x="14" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Apple Silicon MPS / CUDA</text>
    
    <rect x="14" y="80" width="197" height="16" rx="3" fill="#500724" />
    <text x="70" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F472B6">SYNTH: ~16ms</text>
  </g>

  <!-- ================= BOTTOM OSCILLOSCOPE & VU METERS ================= -->
  <g transform="translate(60, 180)">
    <!-- CRT Oscilloscope Screen -->
    <rect width="780" height="150" rx="8" fill="#020C07" stroke="#052E16" stroke-width="1.8" />
    <rect width="780" height="150" rx="8" fill="url(#v-scope-grid)" />
    
    <text x="18" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#39FF14">
      CRT OSCILLOSCOPE // REAL-TIME SPEECH HARMONICS (440Hz SINE)
    </text>

    <!-- Animated Waveform -->
    <g transform="translate(15, 80)" stroke="#39FF14" stroke-width="2.2" fill="none" filter="url(#v-glow)">
      <path d="M 0 0 Q 35 -55, 70 0 T 140 0 T 210 0 T 280 0 T 350 0 T 420 0 T 490 0 T 560 0 T 630 0 T 700 0 T 750 0" class="wave" />
      <path d="M 0 0 Q 45 40, 90 0 T 180 0 T 270 0 T 360 0 T 450 0 T 540 0 T 630 0 T 720 0 T 750 0" stroke="#00F0FF" stroke-width="1.4" opacity="0.6" class="wave" />
    </g>

    <text x="18" y="136" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10B981">
      SAMPLING: 48,000 SPS · Vpp: 1.42V · BUFFER JITTER: &lt; 2ms
    </text>

    <!-- STEREO VU METERS & TOTAL LATENCY READOUT (RIGHT) -->
    <g transform="translate(805, 0)">
      <rect width="275" height="150" rx="8" fill="#090516" stroke="#251642" stroke-width="1.2" />
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#00F0FF">
        STEREO VU (dB)
      </text>

      <g transform="translate(28, 36)">
        <text x="0" y="8" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">CH L</text>
        <rect x="0" y="14" width="24" height="60" rx="3" fill="#120924" />
        <rect x="0" y="30" width="24" height="44" rx="3" fill="#39FF14" class="vu-l" filter="url(#v-glow)" />

        <text x="50" y="8" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">CH R</text>
        <rect x="50" y="14" width="24" height="60" rx="3" fill="#120924" />
        <rect x="50" y="20" width="24" height="54" rx="3" fill="#00F0FF" class="vu-r" filter="url(#v-glow)" />

        <g transform="translate(95, 20)" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#71717A">
          <text y="8" fill="#EF4444">+3dB</text>
          <text y="24" fill="#F59E0B">0dB</text>
          <text y="42" fill="#39FF14">-6dB</text>
          <text y="60" fill="#39FF14">-18dB</text>
        </g>
      </g>

      <rect x="14" y="115" width="247" height="24" rx="4" fill="#052E16" stroke="#39FF14" stroke-width="1" />
      <text x="137" y="131" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#39FF14">
        ⚡ GLASS-TO-GLASS: 98ms
      </text>
    </g>
  </g>

  <!-- Bottom Divider for Seamless Docking -->
  <line x1="0" y1="360" x2="1200" y2="360" stroke="#2B144E" stroke-width="1" />
</svg>
