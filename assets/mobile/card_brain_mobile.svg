<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0602" />
      <stop offset="50%" stop-color="#1A0D04" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <pattern id="mb-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3D200A" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <filter id="mb-glow">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="mb-laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <style>
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes pulseSynapse { 0% { stroke-dashoffset: 80; } 100% { stroke-dashoffset: 0; } }
      @keyframes ringSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes mScanBrain {
        0%, 27.1% { transform: translateY(-30px); opacity: 0; }
        27.2% { transform: translateY(-10px); opacity: 1; }
        42.0% { transform: translateY(295px); opacity: 1; }
        42.9% { transform: translateY(320px); opacity: 0; }
        43.0%, 100% { transform: translateY(-30px); opacity: 0; }
      }
      .live-dot { animation: pulseDot 2s infinite ease-in-out; }
      .synapse-line { stroke-dasharray: 6, 8; animation: pulseSynapse 2s linear infinite; }
      .ring-m { transform-origin: 0px 0px; animation: ringSpin 10s linear infinite; }
      .m-scan-beam-brain { animation: mScanBrain 8s linear infinite; }
    </style>
  </defs>

  <rect width="480" height="320" rx="8" fill="url(#mb-bg)" stroke="#F59E0B" stroke-width="1.4" />
  <rect width="480" height="320" rx="8" fill="url(#mb-grid)" />

  <!-- Content -->
  <g transform="translate(18, 30)">
    <text font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">
      🧠 THE BRAIN
    </text>

    <!-- Difficulty Badge -->
    <g transform="translate(148, -15)">
      <rect width="66" height="18" rx="2" fill="#2E1C0A" />
      <text x="5" y="13" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#94A3B8">DIFFICULTY</text>
      <rect x="66" y="0" width="94" height="18" rx="2" fill="#D97706" />
      <text x="72" y="13" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#FFFFFF">UNREASONABLE</text>
    </g>

    <!-- Status Chip -->
    <g transform="translate(340, -15)">
      <rect width="90" height="18" rx="9" fill="#241406" stroke="#F59E0B" stroke-width="0.8" />
      <circle cx="10" cy="9" r="3" fill="#FBBF24" class="live-dot" />
      <text x="18" y="13" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#FDE68A">FINE-TUNED</text>
    </g>
  </g>

  <text x="18" y="62" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#FB923C">
    LLMs, Fine-Tuning &amp; Cognitive Architecture
  </text>

  <g transform="translate(18, 84)" font-family="'JetBrains Mono', monospace" font-size="10.8" fill="#94A3B8">
    <text y="0">Custom adaptation: <tspan fill="#F8FAFC" font-weight="700">LoRA, QLoRA, SFT &amp; DPO</tspan> alignment.</text>
    <text y="18">Multi-agent swarms, stateful graphs &amp; beyond <tspan fill="#F8FAFC" font-weight="700">if/else</tspan>.</text>
    <text y="36">High-throughput quantized inference for reasoning.</text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(18, 140)">
    <rect x="0" y="0" width="88" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="7" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">LoRA/QLoRA</text>

    <rect x="94" y="0" width="76" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="101" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">SFT &amp; DPO</text>

    <rect x="176" y="0" width="82" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="183" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">LangGraph</text>

    <rect x="264" y="0" width="82" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="271" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">vLLM / TGI</text>

    <rect x="352" y="0" width="88" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="359" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Hybrid RAG</text>
  </g>

  <!-- Divider -->
  <line x1="18" y1="172" x2="462" y2="172" stroke="#3D200A" stroke-width="1" />

  <!-- Animated Neural Canvas for Mobile -->
  <g transform="translate(18, 185)">
    <rect width="444" height="85" rx="6" fill="#0A0401" stroke="#2E1706" stroke-width="1" />
    
    <!-- Synaptic Axon Connections (8 Paths) -->
    <line x1="35" y1="24" x2="130" y2="18" stroke="#F59E0B" stroke-width="1.4" class="synapse-line" />
    <line x1="35" y1="24" x2="130" y2="42.5" stroke="#FBBF24" stroke-width="1.4" class="synapse-line" />
    <line x1="35" y1="60" x2="130" y2="42.5" stroke="#F59E0B" stroke-width="1.4" class="synapse-line" />
    <line x1="35" y1="60" x2="130" y2="67" stroke="#D97706" stroke-width="1.4" class="synapse-line" />

    <line x1="130" y1="18" x2="225" y2="42.5" stroke="#FBBF24" stroke-width="1.4" class="synapse-line" />
    <line x1="130" y1="42.5" x2="225" y2="42.5" stroke="#F59E0B" stroke-width="1.4" class="synapse-line" />
    <line x1="130" y1="67" x2="225" y2="42.5" stroke="#D97706" stroke-width="1.4" class="synapse-line" />
    <line x1="225" y1="42.5" x2="330" y2="42.5" stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="4,4" />

    <!-- Layer 1: Input Nodes -->
    <circle cx="35" cy="24" r="4.5" fill="#D97706" filter="url(#mb-glow)" />
    <text x="35" y="14" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#FDE68A">IN_0</text>

    <circle cx="35" cy="60" r="4.5" fill="#D97706" filter="url(#mb-glow)" />
    <text x="35" y="74" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#FDE68A">IN_1</text>

    <!-- Layer 2: Hidden / LoRA Adapter Nodes -->
    <circle cx="130" cy="18" r="5" fill="#FBBF24" filter="url(#mb-glow)" />
    <text x="130" y="10" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#FBBF24">LoRA_A</text>

    <circle cx="130" cy="42.5" r="6" fill="#F59E0B" filter="url(#mb-glow)" class="live-dot" />
    <text x="130" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#FDE68A">ATTN_W</text>

    <circle cx="130" cy="67" r="5" fill="#D97706" filter="url(#mb-glow)" />
    <text x="130" y="79" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#FCD34D">LoRA_B</text>

    <!-- Layer 3: Output Reasoning Node -->
    <circle cx="225" cy="42.5" r="7" fill="#FBBF24" filter="url(#mb-glow)" class="live-dot" />
    <text x="225" y="60" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FDE68A">REASON</text>

    <!-- Gyroscope Attention Head (In-place rotation) -->
    <g transform="translate(380, 42.5)">
      <g class="ring-m">
        <circle cx="0" cy="0" r="26" fill="#0E0702" stroke="#4D2808" stroke-width="1" />
        <ellipse cx="0" cy="0" rx="22" ry="8" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="10, 6" />
        <ellipse cx="0" cy="0" rx="8" ry="22" fill="none" stroke="#D97706" stroke-width="1" stroke-dasharray="8, 8" />
        <circle cx="0" cy="0" r="4.5" fill="#FBBF24" filter="url(#mb-glow)" />
      </g>
      <text x="0" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#FDE68A">HEAD: 32/32</text>
    </g>
  </g>

  <!-- Quest & Telemetry -->
  <g transform="translate(18, 285)">
    <rect width="155" height="24" rx="4" fill="#241406" stroke="#F59E0B" stroke-width="0.9" />
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FBBF24">
      QUEST: MAKE IT THINK
    </text>
    <text x="450" y="12" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#F59E0B">
      EVALS: &gt;94% ACC · AWQ
    </text>
    <text x="450" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">
      FINE-TUNING: PRODUCTION
    </text>
  </g>

  <!-- Global Mobile Scanline Beam Segment (27.2% to 42.9%) -->
  <g class="m-scan-beam-brain" pointer-events="none">
    <rect width="480" height="24" fill="url(#mb-laser-beam)" />
    <line x1="0" y1="24" x2="480" y2="24" stroke="#FBBF24" stroke-width="2" filter="url(#mb-glow)" />
    <line x1="0" y1="23" x2="480" y2="23" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
