    <text x="340" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#39FF14">● EXPERIMENTAL</text>
    
    <g transform="translate(14, 40)" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">
