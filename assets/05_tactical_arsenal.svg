      <rect x="565" y="0" width="180" height="26" rx="4" fill="#101838" stroke="#3B82F6" stroke-width="0.8" />
      <text x="575" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#60A5FA">🐘 PGVECTOR &amp; SQL</text>

      <!-- Item 5: Redis -->
      <rect x="760" y="0" width="160" height="26" rx="4" fill="#101838" stroke="#EF4444" stroke-width="0.8" />
      <text x="770" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F87171">⚡ REDIS STREAMS</text>

