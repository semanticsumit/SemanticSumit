<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="b-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0602" />
      <stop offset="50%" stop-color="#1A0D04" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <linearGradient id="b-laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <pattern id="b-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3D200A" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <filter id="b-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
      @keyframes pulseSynapse { 0% { stroke-dashoffset: 120; } 100% { stroke-dashoffset: 0; } }
      @keyframes ringSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes ringRev { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
      @keyframes scanBeam { 0%, 100% { transform: translateY(0px); opacity: 0.2; } 50% { transform: translateY(160px); opacity: 0.8; } }
      @keyframes nodeGlow { 0%, 100% { r: 5; opacity: 1; } 50% { r: 7.5; opacity: 0.6; } }
      @keyframes globalScanBrain {
        0%, 26.3% { transform: translateY(-30px); opacity: 0; }
        26.4% { transform: translateY(-10px); opacity: 1; }
        41.0% { transform: translateY(220px); opacity: 1; }
        42.0% { transform: translateY(240px); opacity: 0; }
        42.1%, 100% { transform: translateY(-30px); opacity: 0; }
      }

      .live-dot { animation: pulseDot 2s infinite ease-in-out; }
      .synapse-line { stroke-dasharray: 8, 12; animation: pulseSynapse 2.5s linear infinite; }
      .synapse-fast { stroke-dasharray: 6, 8; animation: pulseSynapse 1.4s linear infinite; }
      .ring-core { transform-origin: 0px 0px; animation: ringSpin 12s linear infinite; }
      .ring-core-rev { transform-origin: 0px 0px; animation: ringRev 8s linear infinite; }
      .scan-line { animation: scanBeam 3.5s ease-in-out infinite; }
      .node-pulse { animation: nodeGlow 2s infinite ease-in-out; }
      .global-scan-beam-brain { animation: globalScanBrain 8s linear infinite; }
    </style>
  </defs>

  <!-- Card Chassis Frame -->
  <rect width="1200" height="240" rx="8" fill="url(#b-bg)" stroke="#F59E0B" stroke-width="1.4" />
  <rect width="1200" height="240" rx="8" fill="url(#b-grid)" />

  <!-- ================= LEFT COLUMN: CONTENT & SPECS ================= -->
  <g transform="translate(36, 32)">
    <!-- Header: Title + Difficulty Badge + Status -->
    <text font-family="'Inter', -apple-system, sans-serif" font-size="21" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      🧠 THE BRAIN
    </text>

    <!-- Difficulty Badge -->
    <g transform="translate(180, -17)">
      <rect width="78" height="20" rx="3" fill="#2E1C0A" />
      <text x="7" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#94A3B8">DIFFICULTY</text>
      <rect x="78" y="0" width="105" height="20" rx="3" fill="#D97706" />
      <text x="86" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#FFFFFF">UNREASONABLE</text>
    </g>

    <!-- Status Pill -->
    <g transform="translate(375, -17)">
      <rect width="102" height="20" rx="10" fill="#241406" stroke="#F59E0B" stroke-width="0.8" />
      <circle cx="12" cy="10" r="3.5" fill="#FBBF24" class="live-dot" />
      <text x="22" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" font-weight="800" fill="#FDE68A">FINE-TUNED</text>
    </g>

    <!-- Subtitle -->
    <text y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#FB923C" letter-spacing="0.3">
      LLMs, Fine-Tuning &amp; Cognitive Architecture
    </text>

    <!-- Well-Defined Description -->
    <g transform="translate(0, 54)" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#94A3B8">
      <text y="0">Custom domain adaptation: <tspan fill="#F8FAFC" font-weight="700">LoRA, QLoRA, SFT &amp; DPO</tspan> alignment.</text>
      <text y="19">Multi-agent swarms, stateful graphs (LangGraph) &amp; software far beyond <tspan fill="#F8FAFC" font-weight="700">if/else</tspan>.</text>
      <text y="38">Quantized, high-throughput inference serving for reasoning &amp; multi-step planning.</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 114)">
      <rect x="0" y="0" width="104" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">LoRA / QLoRA</text>

      <rect x="112" y="0" width="94" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="122" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">SFT &amp; DPO</text>

      <rect x="214" y="0" width="96" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="224" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">LangGraph</text>

      <rect x="318" y="0" width="94" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="328" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">vLLM / TGI</text>

      <rect x="420" y="0" width="98" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="430" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Hybrid RAG</text>
    </g>

    <!-- Bottom Row: Quest & Telemetry -->
    <g transform="translate(0, 150)">
      <rect width="170" height="26" rx="4" fill="#241406" stroke="#F59E0B" stroke-width="1" />
      <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#FBBF24">
        QUEST: MAKE IT THINK
      </text>

      <text x="200" y="17" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F59E0B">
        EVALS: &gt;94% ACC · WEIGHTS: QUANTIZED
      </text>
      <text x="445" y="17" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">
        ADAPTATION: DOMAIN-SPECIFIC REASONING
      </text>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="720" y1="20" x2="720" y2="220" stroke="#3D200A" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- ================= RIGHT COLUMN: ANIMATED NEURAL SYNAPSE & ATTENTION MATRIX ================= -->
  <g transform="translate(735, 18)">
    <!-- Visual Screen Frame -->
    <rect width="430" height="204" rx="6" fill="#0A0401" stroke="#2E1706" stroke-width="1" />
    <rect width="430" height="20" rx="6" fill="#180A03" />
    <path d="M 0 16 L 0 20 L 430 20 L 430 16 Z" fill="#180A03" />
    <circle cx="14" cy="10" r="3" fill="#EF4444" />
    <circle cx="24" cy="10" r="3" fill="#F59E0B" />
    <circle cx="34" cy="10" r="3" fill="#10B981" />
    <text x="50" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717A">neural_cortex_telemetry — weights.matrix [live]</text>

    <!-- Attention Graph & Axon Synapse Lines -->
    <g>
      <!-- Synaptic Transmission Lines -->
      <line x1="40" y1="68" x2="125" y2="48" stroke="#F59E0B" stroke-width="1.5" class="synapse-fast" />
      <line x1="40" y1="68" x2="125" y2="104" stroke="#FBBF24" stroke-width="1.5" class="synapse-line" />
      <line x1="40" y1="140" x2="125" y2="104" stroke="#F59E0B" stroke-width="1.5" class="synapse-line" />
      <line x1="40" y1="140" x2="125" y2="160" stroke="#D97706" stroke-width="1.5" class="synapse-fast" />

      <line x1="125" y1="48" x2="125" y2="104" stroke="#FBBF24" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
      <line x1="125" y1="160" x2="125" y2="104" stroke="#D97706" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

      <line x1="125" y1="48" x2="220" y2="104" stroke="#FBBF24" stroke-width="1.5" class="synapse-line" />
      <line x1="125" y1="104" x2="220" y2="104" stroke="#F59E0B" stroke-width="2" class="synapse-fast" />
      <line x1="125" y1="160" x2="220" y2="104" stroke="#D97706" stroke-width="1.5" class="synapse-line" />

      <!-- Synaptic Transmission Beam to Attention Head -->
      <line x1="229" y1="104" x2="324" y2="104" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="5, 5" class="synapse-fast" />
      <circle cx="324" cy="104" r="2.5" fill="#FBBF24" filter="url(#b-glow)" />

      <!-- Input Layer Nodes -->
      <circle cx="40" cy="68" r="5.5" fill="#D97706" filter="url(#b-glow)" class="node-pulse" />
      <text x="40" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FDE68A">IN_0</text>

      <circle cx="40" cy="140" r="5.5" fill="#D97706" filter="url(#b-glow)" class="node-pulse" />
      <text x="40" y="156" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FDE68A">IN_1</text>

      <!-- Hidden / LoRA Adapter Layer Nodes -->
      <circle cx="125" cy="48" r="6.5" fill="#FBBF24" filter="url(#b-glow)" />
      <text x="125" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FBBF24">LoRA_A</text>

      <circle cx="125" cy="104" r="7.5" fill="#F59E0B" filter="url(#b-glow)" class="node-pulse" />
      <text x="125" y="122" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FDE68A">ATTN_W</text>

      <circle cx="125" cy="160" r="6.5" fill="#D97706" filter="url(#b-glow)" />
      <text x="125" y="176" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FCD34D">LoRA_B</text>

      <!-- Output Reasoning Node -->
      <circle cx="220" cy="104" r="8.5" fill="#FBBF24" filter="url(#b-glow)" class="node-pulse" />
      <text x="220" y="125" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FDE68A">REASON</text>
    </g>

    <!-- Gyroscope Attention Head Indicator -->
    <g transform="translate(360, 104)">
      <circle cx="0" cy="0" r="36" fill="#0E0702" stroke="#4D2808" stroke-width="1" />
      <ellipse cx="0" cy="0" rx="32" ry="12" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="14, 7, 4, 7" class="ring-core" />
      <ellipse cx="0" cy="0" rx="12" ry="32" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="10, 10" class="ring-core-rev" />
      <circle cx="0" cy="0" r="5" fill="#FBBF24" filter="url(#b-glow)" />
      <text x="0" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FDE68A">HEAD: 32/32</text>
    </g>

    <!-- Terminal Telemetry Footer -->
    <g transform="translate(18, 188)" font-family="'JetBrains Mono', monospace" font-size="8.5">
      <text fill="#FBBF24" font-weight="700">TOKENS: 142 T/s</text>
      <text x="135" fill="#F59E0B">LOSS: 0.038 [CONVERGED]</text>
      <text x="290" fill="#FDE68A">QUANT: 4-BIT AWQ</text>
    </g>
  </g>

  <!-- Global Laser Scanline Beam Segment (26.4% to 42.0%) -->
  <g class="global-scan-beam-brain" pointer-events="none">
    <rect width="1200" height="28" fill="url(#b-laser-beam)" />
    <line x1="0" y1="28" x2="1200" y2="28" stroke="#FBBF24" stroke-width="2" filter="url(#b-glow)" />
    <line x1="0" y1="27" x2="1200" y2="27" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
