<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="tel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080612" />
      <stop offset="50%" stop-color="#0F0A20" />
      <stop offset="100%" stop-color="#070511" />
    </linearGradient>

    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="bar-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="bar-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="tel-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.3); opacity: 0.4; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes gaugeSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes gaugeSpinRev {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      .dash-flow {
        stroke-dasharray: 4, 4;
        animation: dashMove 1.5s linear infinite;
      }
      .g-spin {
        transform-origin: 90px 85px;
        animation: gaugeSpin 10s linear infinite;
      }
      .g-spin-rev {
        transform-origin: 90px 85px;
        animation: gaugeSpinRev 16s linear infinite;
      }
      .pulse-dot {
        animation: pulseNode 2.2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Chassis Frame -->
  <rect width="1000" height="310" rx="12" fill="url(#tel-bg)" stroke="#27184A" stroke-width="1.5" />

  <!-- TOP HEADER -->
  <g transform="translate(30, 26)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="1.5">
      // SYSTEM_VITALS &amp; OPERATIONAL_TELEMETRY
    </text>
    <text x="520" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#A855F7">
      DIAGNOSTIC MATRIX // TICK_RATE: 1000Hz // REALITY_SYNCHRONIZED
    </text>
    <line x1="0" y1="12" x2="940" y2="12" stroke="#251642" stroke-width="1" />
  </g>

  <!-- ================= COLUMN 1: QUANTUM CORE DIAL ================= -->
  <g transform="translate(40, 55)">
    <rect width="280" height="225" rx="8" fill="#0C091C" stroke="#2B1A4C" stroke-width="1" />
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#00F0FF">
      01 // NEURAL CAPACITY DIAL
    </text>
    <line x1="18" y1="32" x2="262" y2="32" stroke="#21143D" stroke-width="0.8" />

    <!-- Center Interactive Dial at (140, 125) -->
    <g transform="translate(50, 40)">
      <circle cx="90" cy="85" r="58" fill="none" stroke="#20133A" stroke-width="6" />
      <circle cx="90" cy="85" r="58" fill="none" stroke="#00F0FF" stroke-width="6" stroke-dasharray="290, 80" stroke-linecap="round" filter="url(#tel-glow)" />

      <!-- Inner Spinning HUD Rings -->
      <circle cx="90" cy="85" r="44" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="15, 20, 35, 10" class="g-spin" />
      <circle cx="90" cy="85" r="34" fill="none" stroke="#EC4899" stroke-width="1" stroke-dasharray="10, 30" class="g-spin-rev" />

      <!-- Core readout inside dial -->
      <text x="90" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="900" fill="#FFFFFF">99.8%</text>
      <text x="90" y="96" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#39FF14" font-weight="700">OPTIMAL</text>
    </g>

    <text x="24" y="202" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94A3B8">
      STATUS: <tspan fill="#39FF14" font-weight="700">OVERCLOCKED</tspan> | TEMP: <tspan fill="#00F0FF">42°C</tspan>
    </text>
  </g>

  <!-- ================= COLUMN 2: HARDWARE & CHAOS BARS ================= -->
  <g transform="translate(345, 55)">
    <rect width="330" height="225" rx="8" fill="#0C091C" stroke="#2B1A4C" stroke-width="1" />
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#A855F7">
      02 // MENTAL LOAD &amp; ENGINE GAUGES
    </text>
    <line x1="18" y1="32" x2="312" y2="32" stroke="#21143D" stroke-width="0.8" />

    <g transform="translate(20, 52)" font-family="'JetBrains Mono', monospace" font-size="9.5">
      <!-- Metric 1: Coffee to Code -->
      <text x="0" y="0" fill="#E2E8F0">COFFEE CONVERSION EFFICIENCY</text>
      <text x="250" y="0" fill="#39FF14" font-weight="700">100%</text>
      <rect x="0" y="6" width="290" height="8" rx="4" fill="#1C1433" />
      <rect x="0" y="6" width="288" height="8" rx="4" fill="url(#bar-green)" />

      <!-- Metric 2: Latency Tolerance -->
      <text x="0" y="32" fill="#E2E8F0">LATENCY INTOLERANCE (SUB-100MS)</text>
      <text x="250" y="32" fill="#00F0FF" font-weight="700">98.2%</text>
      <rect x="0" y="38" width="290" height="8" rx="4" fill="#1C1433" />
      <rect x="0" y="38" width="280" height="8" rx="4" fill="url(#bar-cyan)" />

      <!-- Metric 3: Browser Tabs Hoarded -->
      <text x="0" y="64" fill="#E2E8F0">ACTIVE BROWSER TABS HOARDED</text>
      <text x="250" y="64" fill="#EC4899" font-weight="700">64 TABS</text>
      <rect x="0" y="70" width="290" height="8" rx="4" fill="#1C1433" />
      <rect x="0" y="70" width="250" height="8" rx="4" fill="url(#bar-purple)" />

      <!-- Metric 4: 3AM Breakthroughs -->
      <text x="0" y="96" fill="#E2E8F0">"HEAR ME OUT" EXPERIMENTAL RISK</text>
      <text x="250" y="96" fill="#FACC15" font-weight="700">CRITICAL</text>
      <rect x="0" y="102" width="290" height="8" rx="4" fill="#1C1433" />
      <rect x="0" y="102" width="275" height="8" rx="4" fill="url(#neon-cyan-glow)" />

      <!-- Metric 5: Shipping Velocity -->
      <text x="0" y="128" fill="#E2E8F0">SHIPPING VELOCITY (IDEAS TO PROD)</text>
      <text x="250" y="128" fill="#34D399" font-weight="700">INSTANT</text>
      <rect x="0" y="134" width="290" height="8" rx="4" fill="#1C1433" />
      <rect x="0" y="134" width="285" height="8" rx="4" fill="url(#bar-green)" />
    </g>
  </g>

  <!-- ================= COLUMN 3: COMBAT MATRIX & SKILL TIERS ================= -->
  <g transform="translate(700, 55)">
    <rect width="260" height="225" rx="8" fill="#0C091C" stroke="#2B1A4C" stroke-width="1" />
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#EC4899">
      03 // COMBAT LOADOUT TIERS
    </text>
    <line x1="18" y1="32" x2="242" y2="32" stroke="#21143D" stroke-width="0.8" />

    <g transform="translate(18, 50)" font-family="'JetBrains Mono', monospace" font-size="10">
      <!-- Item 1 -->
      <rect x="0" y="0" width="224" height="28" rx="4" fill="#160C2A" stroke="#7928CA" stroke-width="0.8" />
      <text x="10" y="18" fill="#E2E8F0">VOICE AI &amp; AUDIO</text>
      <text x="175" y="18" fill="#39FF14" font-weight="700">[S-TIER]</text>

      <!-- Item 2 -->
      <rect x="0" y="36" width="224" height="28" rx="4" fill="#160C2A" stroke="#7928CA" stroke-width="0.8" />
      <text x="10" y="54" fill="#E2E8F0">LLM AGENT SWARMS</text>
      <text x="175" y="54" fill="#00F0FF" font-weight="700">[S-TIER]</text>

      <!-- Item 3 -->
      <rect x="0" y="72" width="224" height="28" rx="4" fill="#160C2A" stroke="#7928CA" stroke-width="0.8" />
      <text x="10" y="90" fill="#E2E8F0">FASTAPI &amp; PYTHON</text>
      <text x="175" y="90" fill="#F472B6" font-weight="700">[MAXED]</text>

      <!-- Item 4 -->
      <rect x="0" y="108" width="224" height="28" rx="4" fill="#160C2A" stroke="#7928CA" stroke-width="0.8" />
      <text x="10" y="126" fill="#E2E8F0">DOCKER &amp; LINUX</text>
      <text x="175" y="126" fill="#FACC15" font-weight="700">[HARDENED]</text>

      <!-- Item 5 -->
      <rect x="0" y="144" width="224" height="28" rx="4" fill="#160C2A" stroke="#7928CA" stroke-width="0.8" />
      <text x="10" y="162" fill="#E2E8F0">FULLSTACK / REACT</text>
      <text x="175" y="162" fill="#38BDF8" font-weight="700">[OVERKILL]</text>
    </g>
  </g>
</svg>
