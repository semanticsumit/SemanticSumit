      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#60A5FA">⚡ FastAPI [Async]</text>

      <rect x="210" y="0" width="195" height="32" rx="4" fill="#120826" stroke="#38BDF8" stroke-width="0.8" />
      <text x="222" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">🐳 Docker &amp; GHCR</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(16, 124)">
      <rect x="0" y="0" width="195" height="32" rx="4" fill="#120826" stroke="#FACC15" stroke-width="0.8" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FACC15">🐧 Linux [Root Opt]</text>

      <rect x="210" y="0" width="195" height="32" rx="4" fill="#120826" stroke="#EC4899" stroke-width="0.8" />
      <text x="222" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F472B6">🔊 Maya-1 Synth</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(16, 166)">
      <rect x="0" y="0" width="195" height="32" rx="4" fill="#120826" stroke="#38BDF8" stroke-width="0.8" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38BDF8">🔷 TypeScript / React</text>

      <rect x="210" y="0" width="195" height="32" rx="4" fill="#120826" stroke="#A855F7" stroke-width="0.8" />
      <text x="222" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#D8B4FE">🧠 Agent Swarms</text>
