      <rect x="565" y="0" width="180" height="26" rx="4" fill="#200B1E" stroke="#F59E0B" stroke-width="0.8" />
      <text x="575" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#FBBF24">⚡ WEBSOCKETS / WS</text>

