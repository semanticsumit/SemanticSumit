<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient (Machine Obsidian Amber) -->
    <linearGradient id="fndr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0602" />
      <stop offset="50%" stop-color="#1A0D04" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <!-- Title Gradient (Liquid Cyberpunk Amber-Gold) -->
    <linearGradient id="fndr-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="laser-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="25%" stop-color="#FBBF24" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="global-laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow & Neon -->
    <filter id="fndr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur2" />
      <feGaussianBlur stdDeviation="1.8" result="blur1" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="fndr-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3D200A" stroke-width="0.6" stroke-opacity="0.35" />
      <circle cx="30" cy="30" r="0.8" fill="#F59E0B" opacity="0.4" />
    </pattern>

    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.6" stroke-opacity="0.35" />
    </pattern>

    <style>
      @keyframes globalScanHero {
        0% { transform: translateY(-30px); opacity: 0; }
        1% { opacity: 1; }
        22.5% { transform: translateY(330px); opacity: 1; }
        23.5% { transform: translateY(360px); opacity: 0; }
        23.6%, 100% { transform: translateY(-30px); opacity: 0; }
      }
      @keyframes spinGimbal1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinGimbal2 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes spinGimbal3 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes tesseractPulse {
        0%, 100% { transform: rotate(0deg) scale(1); }
        50% { transform: rotate(180deg) scale(1.18); }
      }
      @keyframes coreSingularity {
        0%, 100% { r: 6.5; opacity: 1; }
        50% { r: 9.5; opacity: 0.45; }
      }
      @keyframes radarSweepArm {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes eqPulseA { 0%, 100% { opacity: 0.3; stroke-width: 1.2; } 50% { opacity: 1; stroke-width: 2.2; } }
      @keyframes eqPulseB { 0%, 100% { opacity: 0.8; stroke-width: 2.2; } 50% { opacity: 0.2; stroke-width: 1; } }
      @keyframes sparkFlow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -48; } }
      @keyframes typeLine1 { 0%, 5% { opacity: 0; } 15%, 100% { opacity: 1; } }
      @keyframes typeLine2 { 0%, 35% { opacity: 0; } 45%, 100% { opacity: 1; } }
      @keyframes typeLine3 { 0%, 65% { opacity: 0; } 75%, 100% { opacity: 1; } }
      @keyframes cursorFlash { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes pulseGlow { 0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #F59E0B); } 50% { opacity: 0.4; } }

      .global-scan-beam { animation: globalScanHero 8s linear infinite; }
      .gimbal-1 { transform-origin: 0px 0px; animation: spinGimbal1 14s linear infinite; }
      .gimbal-2 { transform-origin: 0px 0px; animation: spinGimbal2 8s linear infinite; }
      .gimbal-3 { transform-origin: 0px 0px; animation: spinGimbal3 6s linear infinite; }
      .tesseract-box { transform-origin: 0px 0px; animation: tesseractPulse 7s ease-in-out infinite; }
      .core-sing { animation: coreSingularity 2s infinite ease-in-out; }
      .sweep-arm { transform-origin: 0px 0px; animation: radarSweepArm 3.2s linear infinite; }
      .eq-bar-1 { animation: eqPulseA 1.4s ease-in-out infinite; }
      .eq-bar-2 { animation: eqPulseB 1.8s ease-in-out infinite; }
      .eq-bar-3 { animation: eqPulseA 1.1s ease-in-out infinite; }
      .eq-bar-4 { animation: eqPulseB 1.5s ease-in-out infinite; }
      .sparkline-flow { stroke-dasharray: 8, 4; animation: sparkFlow 2s linear infinite; }
      .cursor-blink { animation: cursorFlash 0.8s infinite; }
      .live-pulse { animation: pulseGlow 2s infinite; }
    </style>
  </defs>

  <!-- Canvas Frame: Top rounded, bottom flat for zero-gap docking -->
  <path d="M 0 14 Q 0 0 14 0 L 1186 0 Q 1200 0 1200 14 L 1200 360 L 0 360 Z" fill="url(#fndr-bg)" stroke="#F59E0B" stroke-width="1.8" />
  <path d="M 0 14 Q 0 0 14 0 L 1186 0 Q 1200 0 1200 14 L 1200 360 L 0 360 Z" fill="url(#fndr-grid)" />

  <!-- TOP HUD BAR (Amber Palette) -->
  <g transform="translate(50, 28)">
    <circle cx="0" cy="0" r="4.5" fill="#FBBF24" class="live-pulse" />
    <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FBBF24" letter-spacing="1">
      FOUNDER &amp; CTO · SYSTEM &amp; PRODUCT ARCHITECT
    </text>

    <text x="425" y="4" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#FDE68A" letter-spacing="1">
      0 ➔ 1 VENTURE BUILDER
    </text>

    <text x="655" y="4" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#F59E0B" letter-spacing="1">
      AI · LLMS · VOICE · INFRA
    </text>

    <text x="1025" y="4" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8" letter-spacing="1">
      INDIA · 28°N
    </text>
    <line x1="-10" y1="14" x2="1115" y2="14" stroke="url(#laser-beam)" stroke-width="1.2" />
  </g>

  <!-- MAIN OPERATOR TITLE & POSITIONING -->
  <g transform="translate(60, 78)">
    <!-- Main Glowing Title -->
    <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#fndr-title)" filter="url(#fndr-glow)" letter-spacing="2.5">
      SEMANTIC SUMIT
    </text>

    <!-- Founder Headline -->
    <text x="2" y="74" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">
      Building AI-First Products &amp; Scaling Companies from Zero to Production.
    </text>

    <text x="2" y="98" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">
      Architecting Voice AI, LLMs &amp; Fine-Tuning, Autonomous Agents, Distributed Cloud &amp; Mobile.
    </text>

    <!-- 4 Strategic Founder Badges -->
    <g transform="translate(2, 118)">
      <rect x="0" y="0" width="155" height="26" rx="13" fill="#140702" stroke="#F59E0B" stroke-width="1.2" />
      <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FBBF24">🚀 Founder &amp; CTO</text>

      <rect x="167" y="0" width="190" height="26" rx="13" fill="#140702" stroke="#F59E0B" stroke-width="1.2" />
      <text x="181" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FDE68A">🎙️ Real-Time Voice AI</text>

      <rect x="369" y="0" width="195" height="26" rx="13" fill="#140702" stroke="#F59E0B" stroke-width="1.2" />
      <text x="383" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FDE68A">🧠 LLMs &amp; Fine-Tuning</text>

      <rect x="576" y="0" width="180" height="26" rx="13" fill="#140702" stroke="#F59E0B" stroke-width="1.2" />
      <text x="590" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FBBF24">📱 Full-Stack Web/App</text>
    </g>
  </g>

  <!-- LIVE SIMULATED SYSTEM & PRODUCT TERMINAL -->
  <g transform="translate(60, 235)">
    <rect width="756" height="105" rx="8" fill="#070301" stroke="#3D200A" stroke-width="1.2" />
    <rect width="756" height="24" rx="8" fill="#140802" />
    <path d="M 0 18 L 0 24 L 756 24 L 756 18 Z" fill="#140802" />
    <circle cx="14" cy="12" r="3.5" fill="#EF4444" />
    <circle cx="26" cy="12" r="3.5" fill="#F59E0B" />
    <circle cx="38" cy="12" r="3.5" fill="#10B981" />
    <text x="54" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717A">founder_terminal — sumit@7silicongroup</text>

    <!-- Typing Output -->
    <g transform="translate(18, 45)" font-family="'JetBrains Mono', monospace" font-size="11">
      <g style="animation: typeLine1 8s infinite;">
        <text y="0" fill="#FBBF24" font-weight="700">sumit@7silicongroup:~$</text>
        <text x="160" y="0" fill="#F8FAFC">./architect_and_ship_company.sh --scale=production</text>
      </g>
      <g style="animation: typeLine2 8s infinite;" transform="translate(0, 20)">
        <text y="0" fill="#F59E0B">[FOUNDER_PIPELINE]</text>
        <text x="145" y="0" fill="#E2E8F0">Voice AI + LLM Fine-Tuning + Distributed APIs Synced</text>
      </g>
      <g style="animation: typeLine3 8s infinite;" transform="translate(0, 40)">
        <text y="0" fill="#FDE68A">"Understand the system. Question the system. Then build the company."</text>
        <rect x="660" y="-10" width="8" height="13" fill="#FBBF24" class="cursor-blink" />
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT SIDE: ULTRA-FUTURISTIC HOLOGRAPHIC QUANTUM REACTOR & NEURAL COCKPIT -->
  <!-- ========================================================================= -->
  <g transform="translate(0, 0)">
    <!-- Cyberdeck Glass Outer Bracket -->
    <rect x="836" y="56" width="328" height="288" rx="10" fill="#060201" stroke="#3D200A" stroke-width="1.4" />
    <path d="M 836 56 L 1164 56 L 1164 84 L 836 84 Z" fill="#140802" rx="10" />

    <!-- High-Tech Chamfer Corner Calipers -->
    <path d="M 842 74 L 842 62 L 854 62" fill="none" stroke="#F59E0B" stroke-width="2" />
    <path d="M 1158 74 L 1158 62 L 1146 62" fill="none" stroke="#F59E0B" stroke-width="2" />
    <path d="M 842 326 L 842 338 L 854 338" fill="none" stroke="#D97706" stroke-width="2" />
    <path d="M 1158 326 L 1158 338 L 1146 338" fill="none" stroke="#D97706" stroke-width="2" />

    <!-- Cockpit Title Bar -->
    <circle cx="854" cy="70" r="3.5" fill="#EF4444" />
    <circle cx="866" cy="70" r="3.5" fill="#F59E0B" />
    <circle cx="878" cy="70" r="3.5" fill="#10B981" />
    <text x="894" y="74" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#94A3B8">
      QUANTUM HYPERCORE · TESSERACT
    </text>
    <circle cx="1098" cy="70" r="3" fill="#FBBF24" class="live-pulse" />
    <text x="1108" y="73" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#FBBF24">ONLINE</text>
    <line x1="836" y1="84" x2="1164" y2="84" stroke="#2E1706" stroke-width="1" />

    <!-- 4 Live Quadrant Telemetry Indicators -->
    <g font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">
      <rect x="848" y="94" width="76" height="18" rx="9" fill="#140702" stroke="#D97706" stroke-width="0.9" />
      <text x="886" y="106" text-anchor="middle" fill="#FDE68A">🧠 142 T/S</text>

      <rect x="1076" y="94" width="76" height="18" rx="9" fill="#140702" stroke="#F59E0B" stroke-width="0.9" />
      <text x="1114" y="106" text-anchor="middle" fill="#FBBF24">🎙️ &lt;84MS</text>

      <rect x="848" y="260" width="76" height="18" rx="9" fill="#140702" stroke="#D97706" stroke-width="0.9" />
      <text x="886" y="272" text-anchor="middle" fill="#FDE68A">⚡ &lt;18MS</text>

      <rect x="1076" y="260" width="76" height="18" rx="9" fill="#140702" stroke="#F59E0B" stroke-width="0.9" />
      <text x="1114" y="272" text-anchor="middle" fill="#FBBF24">🧪 SWARM L4</text>
    </g>

    <!-- ================= THE QUANTUM REACTOR ENGINE ================= -->
    <!-- Centered precisely at (1000, 182) -->
    <g transform="translate(1000, 182)">
      <!-- Hexagonal Reactor Well -->
      <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="#0A0401" stroke="#2E1706" stroke-width="1.2" />

      <!-- Compass Degrees & Radar Crosshairs -->
      <circle cx="0" cy="0" r="66" fill="none" stroke="#261204" stroke-width="0.8" stroke-dasharray="3, 3" />
      <line x1="-72" y1="0" x2="72" y2="0" stroke="#261204" stroke-width="0.8" stroke-dasharray="4, 4" />
      <line x1="0" y1="-72" x2="0" y2="72" stroke="#261204" stroke-width="0.8" stroke-dasharray="4, 4" />

      <!-- VOICE AI RADIAL AUDIO EQUALIZER HALO (Amber Frequencies) -->
      <g stroke-linecap="round" stroke-width="1.8">
        <line x1="0" y1="-66" x2="0" y2="-76" stroke="#FBBF24" class="eq-bar-1" />
        <line x1="25" y1="-61" x2="29" y2="-70" stroke="#F59E0B" class="eq-bar-2" />
        <line x1="47" y1="-47" x2="54" y2="-54" stroke="#D97706" class="eq-bar-3" />
        <line x1="61" y1="-25" x2="70" y2="-29" stroke="#FDE68A" class="eq-bar-4" />
        <line x1="66" y1="0" x2="76" y2="0" stroke="#FBBF24" class="eq-bar-1" />
        <line x1="61" y1="25" x2="70" y2="29" stroke="#F59E0B" class="eq-bar-2" />
        <line x1="47" y1="47" x2="54" y2="54" stroke="#D97706" class="eq-bar-3" />
        <line x1="25" y1="61" x2="29" y2="70" stroke="#FDE68A" class="eq-bar-4" />
        <line x1="0" y1="66" x2="0" y2="76" stroke="#FBBF24" class="eq-bar-1" />
        <line x1="-25" y1="61" x2="-29" y2="70" stroke="#F59E0B" class="eq-bar-2" />
        <line x1="-47" y1="47" x2="-54" y2="54" stroke="#D97706" class="eq-bar-3" />
        <line x1="-61" y1="25" x2="-70" y2="29" stroke="#FDE68A" class="eq-bar-4" />
        <line x1="-66" y1="0" x2="-76" y2="0" stroke="#FBBF24" class="eq-bar-1" />
        <line x1="-61" y1="-25" x2="-70" y2="-29" stroke="#F59E0B" class="eq-bar-2" />
        <line x1="-47" y1="-47" x2="-54" y2="-54" stroke="#D97706" class="eq-bar-3" />
        <line x1="-25" y1="-61" x2="-29" y2="-70" stroke="#FDE68A" class="eq-bar-4" />
      </g>

      <!-- 3D GIMBAL RING 1 (Outer Amber, Clockwise with 4 Qubits) -->
      <g class="gimbal-1">
        <circle cx="0" cy="0" r="54" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="24, 12, 6, 12" />
        <!-- 4 Orbiting Qubit Particles -->
        <circle cx="0" cy="-54" r="2.8" fill="#FBBF24" filter="url(#fndr-glow)" />
        <circle cx="54" cy="0" r="2.8" fill="#FBBF24" filter="url(#fndr-glow)" />
        <circle cx="0" cy="54" r="2.8" fill="#FBBF24" filter="url(#fndr-glow)" />
        <circle cx="-54" cy="0" r="2.8" fill="#FBBF24" filter="url(#fndr-glow)" />
      </g>

      <!-- 3D GIMBAL RING 2 (Bronze Elliptical, Counter-Clockwise) -->
      <g class="gimbal-2">
        <ellipse cx="0" cy="0" rx="44" ry="18" fill="none" stroke="#D97706" stroke-width="1.4" stroke-dasharray="16, 8, 4, 8" />
        <circle cx="44" cy="0" r="2.4" fill="#D97706" />
        <circle cx="-44" cy="0" r="2.4" fill="#D97706" />
      </g>

      <!-- 3D GIMBAL RING 3 (Gold Elliptical, Tilted) -->
      <g class="gimbal-3">
        <ellipse cx="0" cy="0" rx="18" ry="44" fill="none" stroke="#B45309" stroke-width="1.2" stroke-dasharray="12, 12" />
        <circle cx="0" cy="44" r="2.2" fill="#FDE68A" />
        <circle cx="0" cy="-44" r="2.2" fill="#FDE68A" />
      </g>

      <!-- RADAR TARGETING SWEEP ARM -->
      <g class="sweep-arm">
        <line x1="0" y1="0" x2="0" y2="-54" stroke="#FBBF24" stroke-width="1.8" filter="url(#fndr-glow)" />
        <path d="M 0 0 L 22 -49 A 54 54 0 0 0 0 -54 Z" fill="#F59E0B" opacity="0.22" />
      </g>

      <!-- 3D MORPHING TESSERACT HYPERCUBE -->
      <g class="tesseract-box">
        <!-- Outer Diamond -->
        <polygon points="0,-28 28,0 0,28 -28,0" fill="#180902" fill-opacity="0.75" stroke="#F59E0B" stroke-width="1.5" />
        
        <!-- Inner Diamond -->
        <polygon points="0,-14 14,0 0,14 -14,0" fill="#0A0401" fill-opacity="0.85" stroke="#FBBF24" stroke-width="1.2" />

        <!-- 4D Hypercube Struts -->
        <line x1="0" y1="-28" x2="0" y2="-14" stroke="#D97706" stroke-width="1.2" />
        <line x1="28" y1="0" x2="14" y2="0" stroke="#D97706" stroke-width="1.2" />
        <line x1="0" y1="28" x2="0" y2="14" stroke="#D97706" stroke-width="1.2" />
        <line x1="-28" y1="0" x2="-14" y2="0" stroke="#D97706" stroke-width="1.2" />

        <!-- Glowing 4D Vertices -->
        <circle cx="0" cy="-28" r="2.4" fill="#FBBF24" />
        <circle cx="28" cy="0" r="2.4" fill="#FBBF24" />
        <circle cx="0" cy="28" r="2.4" fill="#FBBF24" />
        <circle cx="-28" cy="0" r="2.4" fill="#FBBF24" />
        <circle cx="0" cy="-14" r="1.8" fill="#FDE68A" />
        <circle cx="14" cy="0" r="1.8" fill="#FDE68A" />
        <circle cx="0" cy="14" r="1.8" fill="#FDE68A" />
        <circle cx="-14" cy="0" r="1.8" fill="#FDE68A" />
      </g>

      <!-- CENTRAL BLAZING SINGULARITY CORE -->
      <circle cx="0" cy="0" r="8" fill="#FBBF24" filter="url(#fndr-glow)" class="core-sing" />
      <circle cx="0" cy="0" r="3.2" fill="#FFFFFF" />
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#F59E0B" stroke-width="1" opacity="0.7" />
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#F59E0B" stroke-width="1" opacity="0.7" />
    </g>

    <!-- LIVE DATA SPARKLINE & FOOTER READOUT -->
    <line x1="846" y1="286" x2="1154" y2="286" stroke="#261204" stroke-width="1" />
    
    <!-- Mini Sparkline Waveform -->
    <g transform="translate(856, 298)">
      <path d="M 0 0 L 20 -4 L 35 3 L 50 -6 L 65 2 L 80 -8 L 95 4 L 110 -5 L 125 1 L 140 -7 L 155 3 L 170 -6 L 185 0 L 200 -5 L 215 2 L 230 -6 L 245 0 L 260 -4 L 275 2 L 288 0" 
            fill="none" stroke="#F59E0B" stroke-width="1.2" opacity="0.8" class="sparkline-flow" />
    </g>

    <text x="1000" y="318" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#FBBF24" letter-spacing="1">
      ARCH: DISTRIBUTED · 100K+ CONC
    </text>
    <text x="1000" y="333" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8" letter-spacing="0.5">
      PRODUCT: ZERO ➔ 1 [DEFENSIBLE]
    </text>
  </g>

  <!-- Scanline Screen Effect Overlay -->
  <rect width="1200" height="360" fill="url(#scanlines)" pointer-events="none" opacity="0.35" />

  <!-- Global Golden-Amber Laser Scanline Beam Segment (0% to 23.5%) -->
  <g class="global-scan-beam" pointer-events="none">
    <rect width="1200" height="28" fill="url(#global-laser-beam)" />
    <line x1="0" y1="28" x2="1200" y2="28" stroke="#FBBF24" stroke-width="2" filter="url(#fndr-glow)" />
    <line x1="0" y1="27" x2="1200" y2="27" stroke="#FFFFFF" stroke-width="0.8" />
  </g>

  <!-- Bottom Divider for Seamless Docking -->
  <line x1="0" y1="360" x2="1200" y2="360" stroke="#F59E0B" stroke-width="1" />
</svg>
