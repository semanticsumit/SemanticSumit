<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030D" />
      <stop offset="50%" stop-color="#0E0820" />
      <stop offset="100%" stop-color="#040209" />
    </linearGradient>

    <pattern id="grid-05" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#23133B" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#bg-05)" stroke="#2B164A" stroke-width="1.8" />
  <rect width="1200" height="340" rx="14" fill="url(#grid-05)" />

  <!-- HEADER -->
  <g transform="translate(45, 26)">
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#00F0FF" letter-spacing="1.5">
      // TACTICAL ARSENAL &amp; COMBAT WEAPON LOADOUT
    </text>
    <text x="690" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A855F7">
