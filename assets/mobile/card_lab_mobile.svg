<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ml-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0602" />
      <stop offset="50%" stop-color="#1A0D04" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <!-- Lab Liquid Gradient -->
    <linearGradient id="m-flask-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#FBBF24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.95" />
    </linearGradient>

    <pattern id="ml-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3D200A" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <filter id="ml-glow">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="ml-laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <style>
      @keyframes pulseLab { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes mBubble1 {
        0% { transform: translateY(0px) scale(0.6); opacity: 0; }
        25% { opacity: 0.9; }
        75% { opacity: 0.9; }
        100% { transform: translateY(-24px) scale(1.1); opacity: 0; }
      }
      @keyframes mBubble2 {
        0% { transform: translateY(0px) scale(0.7); opacity: 0; }
        30% { opacity: 0.95; }
        70% { opacity: 0.9; }
        100% { transform: translateY(-20px) scale(1.15); opacity: 0; }
      }
      @keyframes mDrip {
        0%, 15% { transform: translateY(0px); opacity: 0; }
        25% { opacity: 1; }
        65% { transform: translateY(18px); opacity: 1; }
        70%, 100% { transform: translateY(22px); opacity: 0; }
      }
      @keyframes mCentrifugeSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes mMoleculeSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes mCoilFlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes mScanLab {
        0%, 74.2% { transform: translateY(-30px); opacity: 0; }
        74.3% { transform: translateY(-10px); opacity: 1; }
        89.0% { transform: translateY(295px); opacity: 1; }
        90.0% { transform: translateY(320px); opacity: 0; }
        90.1%, 100% { transform: translateY(-30px); opacity: 0; }
      }

      .live-dot-lab { animation: pulseLab 2s infinite ease-in-out; }
      .mb-rise-1 { animation: mBubble1 1.6s infinite ease-in; }
      .mb-rise-2 { animation: mBubble2 2.1s infinite ease-in; }
      .mdrip-anim { animation: mDrip 2.2s infinite ease-in; }
      .mcentrifuge-spin { transform-origin: 0px 0px; animation: mCentrifugeSpin 6s linear infinite; }
      .mmolecule-spin { transform-origin: 0px 0px; animation: mMoleculeSpin 9s linear infinite; }
      .mcoil-flow { stroke-dasharray: 6, 8; animation: mCoilFlow 1.2s linear infinite; }
      .m-scan-beam-lab { animation: mScanLab 8s linear infinite; }
    </style>
  </defs>

  <rect width="480" height="320" rx="8" fill="url(#ml-bg)" stroke="#F59E0B" stroke-width="1.4" />
  <rect width="480" height="320" rx="8" fill="url(#ml-grid)" />

  <!-- Content -->
  <g transform="translate(18, 30)">
    <text font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">
      🧪 THE LAB
    </text>

    <!-- Difficulty Badge -->
    <g transform="translate(140, -15)">
      <rect width="64" height="18" rx="2" fill="#2E1C0A" />
      <text x="5" y="13" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#94A3B8">DIFFICULTY</text>
      <rect x="64" y="0" width="80" height="18" rx="2" fill="#D97706" />
      <text x="70" y="13" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#FFFFFF">UNDEFINED</text>
    </g>

    <!-- Status Chip -->
    <g transform="translate(345, -15)">
      <rect width="88" height="18" rx="9" fill="#241406" stroke="#F59E0B" stroke-width="0.8" />
      <circle cx="10" cy="9" r="3" fill="#FBBF24" class="live-dot-lab" />
      <text x="18" y="13" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#FDE68A">EXPLORING</text>
    </g>
  </g>

  <text x="18" y="62" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#FB923C">
    Autonomous Swarms, Novel Tools &amp; 0-to-1 R&amp;D
  </text>

  <g transform="translate(18, 84)" font-family="'JetBrains Mono', monospace" font-size="10.8" fill="#94A3B8">
    <text y="0">Untested research turned into <tspan fill="#F8FAFC" font-weight="700">market defensibility</tspan>.</text>
    <text y="18">Self-correcting sandboxes, agent swarms &amp; edge AI.</text>
    <text y="36">The occasional discovery that changes everything.</text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(18, 140)">
    <rect x="0" y="0" width="84" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="7" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Agent Swarms</text>

    <rect x="90" y="0" width="80" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="97" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Code Sandbox</text>

    <rect x="176" y="0" width="82" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="183" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Edge Devices</text>

    <rect x="264" y="0" width="84" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="271" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Multimodal AI</text>

    <rect x="354" y="0" width="66" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="361" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Rapid MVP</text>
  </g>

  <line x1="18" y1="172" x2="462" y2="172" stroke="#3D200A" stroke-width="1" />

  <!-- Animated Cyber Science Lab for Mobile -->
  <g transform="translate(18, 185)">
    <rect width="444" height="85" rx="6" fill="#0A0401" stroke="#2E1706" stroke-width="1" />

    <!-- ================= STAGE 1: BUBBLING FLASK ================= -->
    <g transform="translate(15, 0)">
      <!-- Dropper Pipette -->
      <path d="M 44 8 L 48 8 L 48 18 L 46 22 L 44 18 Z" fill="#1A0D04" stroke="#F59E0B" stroke-width="0.8" />
      <ellipse cx="46" cy="24" rx="1.5" ry="2" fill="#FBBF24" filter="url(#ml-glow)" class="mdrip-anim" />

      <!-- Glass Flask -->
      <path d="M 40 28 L 52 28 M 42 28 L 42 42 L 26 68 Q 25 70 28 70 L 64 70 Q 67 70 66 68 L 50 42 L 50 28" fill="none" stroke="#F59E0B" stroke-width="1.4" />
      <rect x="39" y="27" width="14" height="2" rx="1" fill="#241406" stroke="#F59E0B" stroke-width="0.8" />

      <!-- Amber Reagent Fluid Fill -->
      <path d="M 32 50 Q 46 48 60 50 L 64 69 L 28 69 Z" fill="url(#m-flask-liquid)" />
      <path d="M 32 50 Q 46 48 60 50" fill="none" stroke="#FDE68A" stroke-width="1.2" filter="url(#ml-glow)" />

      <!-- Rising Bubbles -->
      <circle cx="36" cy="66" r="1.8" fill="#FDE68A" class="mb-rise-1" />
      <circle cx="47" cy="67" r="2.2" fill="#FBBF24" class="mb-rise-2" />
      <circle cx="56" cy="66" r="1.6" fill="#FFFFFF" class="mb-rise-1" />

      <!-- Heating Plate -->
      <rect x="24" y="71" width="44" height="4" rx="1.5" fill="#241004" stroke="#F59E0B" stroke-width="0.8" />
      <line x1="28" y1="73" x2="64" y2="73" stroke="#FBBF24" stroke-width="1.2" filter="url(#ml-glow)" stroke-dasharray="3, 2" />
    </g>

    <!-- ================= STAGE 2: CONDENSER TUBE & SYNTHESIS ================= -->
    <!-- Transfer Tube -->
    <path d="M 68 38 L 130 38 Q 140 38 140 46 L 140 52 Q 140 60 150 60 L 220 60 Q 230 60 230 50 L 230 42 Q 230 34 240 34 L 320 34 Q 335 34 335 42.5 L 350 42.5" fill="none" stroke="#3D200A" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 68 38 L 130 38 Q 140 38 140 46 L 140 52 Q 140 60 150 60 L 220 60 Q 230 60 230 50 L 230 42 Q 230 34 240 34 L 320 34 Q 335 34 335 42.5 L 350 42.5" fill="none" stroke="#FBBF24" stroke-width="1.6" stroke-linecap="round" class="mcoil-flow" />

    <!-- Center Molecular Synthesis Ring -->
    <g transform="translate(185, 32)">
      <g class="mmolecule-spin">
        <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="#140702" stroke="#F59E0B" stroke-width="1.2" />
        <circle cx="0" cy="-12" r="2.2" fill="#FBBF24" />
        <circle cx="10" cy="-6" r="2" fill="#D97706" />
        <circle cx="10" cy="6" r="2.2" fill="#FBBF24" />
        <circle cx="0" cy="12" r="2" fill="#D97706" />
        <circle cx="-10" cy="6" r="2.2" fill="#FBBF24" />
        <circle cx="-10" cy="-6" r="2" fill="#D97706" />
        <circle cx="0" cy="0" r="3" fill="#FDE68A" />
      </g>
      <text x="0" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="700" fill="#FDE68A">SYNTHESIS</text>
    </g>

    <!-- ================= STAGE 3: SPINNING 4-VIAL CENTRIFUGE ================= -->
    <g transform="translate(380, 42.5)">
      <circle cx="0" cy="0" r="28" fill="#0E0702" stroke="#4D2808" stroke-width="1" />
      <circle cx="0" cy="0" r="25" fill="none" stroke="#3D200A" stroke-width="0.8" stroke-dasharray="3, 3" />

      <!-- 4 Rapid Spinning Cryo Vials -->
      <g class="mcentrifuge-spin">
        <rect x="-3" y="-24" width="6" height="13" rx="2" fill="#241004" stroke="#F59E0B" stroke-width="0.8" />
        <rect x="-2" y="-20" width="4" height="8" rx="1.5" fill="#FBBF24" filter="url(#ml-glow)" />

        <rect x="11" y="-3" width="13" height="6" rx="2" fill="#241004" stroke="#F59E0B" stroke-width="0.8" />
        <rect x="12" y="-2" width="8" height="4" rx="1.5" fill="#D97706" />

        <rect x="-3" y="11" width="6" height="13" rx="2" fill="#241004" stroke="#F59E0B" stroke-width="0.8" />
        <rect x="-2" y="12" width="4" height="8" rx="1.5" fill="#FBBF24" filter="url(#ml-glow)" />

        <rect x="-24" y="-3" width="13" height="6" rx="2" fill="#241004" stroke="#F59E0B" stroke-width="0.8" />
        <rect x="-20" y="-2" width="8" height="4" rx="1.5" fill="#D97706" />

        <circle cx="0" cy="0" r="6" fill="#140702" stroke="#F59E0B" stroke-width="1" />
        <circle cx="0" cy="0" r="2.8" fill="#FBBF24" filter="url(#ml-glow)" />
      </g>
      <text x="0" y="37" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#FDE68A">12K RPM</text>
    </g>
  </g>

  <!-- Quest & Telemetry -->
  <g transform="translate(18, 285)">
    <rect width="180" height="24" rx="4" fill="#241406" stroke="#F59E0B" stroke-width="0.9" />
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FBBF24">
      QUEST: BREAK THE PATTERN
    </text>
    <text x="450" y="12" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#F59E0B">
      STAGE: SKUNKWORKS
    </text>
    <text x="450" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">
      VELOCITY: ULTRA
    </text>
  </g>

  <!-- Global Mobile Scanline Beam Segment (74.3% to 90.0%) -->
  <g class="m-scan-beam-lab" pointer-events="none">
    <rect width="480" height="24" fill="url(#ml-laser-beam)" />
    <line x1="0" y1="24" x2="480" y2="24" stroke="#FBBF24" stroke-width="2" filter="url(#ml-glow)" />
    <line x1="0" y1="23" x2="480" y2="23" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
