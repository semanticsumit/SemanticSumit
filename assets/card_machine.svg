<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0602" />
      <stop offset="50%" stop-color="#1A0D04" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <linearGradient id="m-laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <pattern id="m-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3D200A" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseMach { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
      @keyframes spinGearSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes spinGearRev { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
      @keyframes packetFlow { 0% { stroke-dashoffset: 80; } 100% { stroke-dashoffset: 0; } }
      @keyframes pulseServer { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes globalScanMach {
        0%, 57.5% { transform: translateY(-30px); opacity: 0; }
        57.6% { transform: translateY(-10px); opacity: 1; }
        72.3% { transform: translateY(220px); opacity: 1; }
        73.3% { transform: translateY(240px); opacity: 0; }
        73.4%, 100% { transform: translateY(-30px); opacity: 0; }
      }

      .live-dot-mach { animation: pulseMach 2s infinite ease-in-out; }
      .gear-spin { transform-origin: 0px 0px; animation: spinGearSlow 14s linear infinite; }
      .gear-spin-rev { transform-origin: 0px 0px; animation: spinGearRev 9s linear infinite; }
      .packet-line { stroke-dasharray: 6, 8; animation: packetFlow 1.2s linear infinite; }
      .packet-fast { stroke-dasharray: 4, 6; animation: packetFlow 0.8s linear infinite; }
      .server-led-1 { animation: pulseServer 1.5s infinite; }
      .server-led-2 { animation: pulseServer 2.1s infinite; }
      .server-led-3 { animation: pulseServer 1.1s infinite; }
      .global-scan-beam-mach { animation: globalScanMach 8s linear infinite; }
    </style>
  </defs>

  <!-- Card Chassis Frame -->
  <rect width="1200" height="240" rx="8" fill="url(#m-bg)" stroke="#F59E0B" stroke-width="1.4" />
  <rect width="1200" height="240" rx="8" fill="url(#m-grid)" />

  <!-- ================= LEFT COLUMN: CONTENT & SPECS ================= -->
  <g transform="translate(36, 32)">
    <!-- Header: Title + Difficulty Badge + Status -->
    <text font-family="'Inter', -apple-system, sans-serif" font-size="21" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      ⚙️ THE MACHINE
    </text>

    <!-- Difficulty Badge -->
    <g transform="translate(195, -17)">
      <rect width="75" height="20" rx="3" fill="#2E1C0A" />
      <text x="6" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#94A3B8">DIFFICULTY</text>
      <rect x="75" y="0" width="145" height="20" rx="3" fill="#D97706" />
      <text x="82" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" font-weight="800" fill="#FFFFFF">IT WORKS ON MY MACHINE</text>
    </g>

    <!-- Status Pill -->
    <g transform="translate(425, -17)">
      <rect width="82" height="20" rx="10" fill="#241406" stroke="#F59E0B" stroke-width="0.8" />
      <circle cx="12" cy="10" r="3.5" fill="#FBBF24" class="live-dot-mach" />
      <text x="22" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" font-weight="800" fill="#FDE68A">SHIPPED</text>
    </g>

    <!-- Subtitle -->
    <text y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#FB923C" letter-spacing="0.3">
      APIs, Distributed Cloud &amp; Production Infra
    </text>

    <!-- Well-Defined Description -->
    <g transform="translate(0, 54)" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#94A3B8">
      <text y="0">Scales from zero to 100K+ concurrent requests with <tspan fill="#F8FAFC" font-weight="700">sub-millisecond data paths</tspan>.</text>
      <text y="19">Async task queues, GPU serving clusters, low-latency caches &amp; real-time event buses.</text>
      <text y="38">Making 17 moving parts behave like one deterministic, self-healing production engine.</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 114)">
      <rect x="0" y="0" width="96" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">FastAPI / Go</text>

      <rect x="104" y="0" width="96" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="114" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Kubernetes</text>

      <rect x="208" y="0" width="100" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="218" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">GPU Serving</text>

      <rect x="316" y="0" width="94" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="326" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Postgres/pg</text>

      <rect x="418" y="0" width="98" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="428" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Redis PubSub</text>
    </g>

    <!-- Bottom Row: Quest & Telemetry -->
    <g transform="translate(0, 150)">
      <rect width="180" height="26" rx="4" fill="#241406" stroke="#F59E0B" stroke-width="1" />
      <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#FBBF24">
        QUEST: SHIP THE THING
      </text>

      <text x="210" y="17" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F59E0B">
        UPTIME: 99.98% · P99: &lt;45MS
      </text>
      <text x="450" y="17" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">
        PIPELINES: AUTO-HEALING &amp; CONCURRENT
      </text>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="720" y1="20" x2="720" y2="220" stroke="#3D200A" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- ================= RIGHT COLUMN: ANIMATED DISTRIBUTED ARCHITECTURE & PIPELINE ================= -->
  <g transform="translate(735, 18)">
    <rect width="430" height="204" rx="6" fill="#0A0401" stroke="#2E1706" stroke-width="1" />
    <rect width="430" height="20" rx="6" fill="#180A03" />
    <path d="M 0 16 L 0 20 L 430 20 L 430 16 Z" fill="#180A03" />
    <circle cx="14" cy="10" r="3" fill="#EF4444" />
    <circle cx="24" cy="10" r="3" fill="#F59E0B" />
    <circle cx="34" cy="10" r="3" fill="#10B981" />
    <text x="50" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717A">distributed_infra — cluster.pipeline [healthy]</text>

    <!-- Pipeline Microservices Architecture Flow -->
    <g>
      <!-- Pipeline Tracks -->
      <!-- CLIENT to GATEWAY -->
      <line x1="82" y1="104" x2="114" y2="104" stroke="#F59E0B" stroke-width="1.8" class="packet-fast" />

      <!-- GATEWAY Fork to GPU-POD & REDIS -->
      <path d="M 188 98 L 206 98 L 206 70 L 224 70" fill="none" stroke="#FBBF24" stroke-width="1.8" class="packet-fast" />
      <path d="M 188 110 L 206 110 L 206 138 L 224 138" fill="none" stroke="#D97706" stroke-width="1.8" class="packet-fast" />

      <!-- Convergence from GPU-POD & REDIS into Turbine -->
      <path d="M 298 70 L 314 70 L 314 104" fill="none" stroke="#FBBF24" stroke-width="1.8" class="packet-line" />
      <path d="M 298 138 L 314 138 L 314 104" fill="none" stroke="#D97706" stroke-width="1.8" class="packet-line" />
      <line x1="314" y1="104" x2="324" y2="104" stroke="#F59E0B" stroke-width="2.2" class="packet-fast" />
      <circle cx="324" cy="104" r="2.5" fill="#FBBF24" filter="url(#m-glow)" />

      <!-- Node 1: CLIENT -->
      <rect x="16" y="88" width="66" height="32" rx="4" fill="#170902" stroke="#F59E0B" stroke-width="1.2" />
      <circle cx="26" cy="104" r="3" fill="#FBBF24" class="server-led-1" />
      <text x="50" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FDE68A">CLIENT</text>

      <!-- Node 2: GATEWAY / LOAD BALANCER -->
      <rect x="114" y="88" width="74" height="32" rx="4" fill="#1A0D04" stroke="#F59E0B" stroke-width="1.2" />
      <circle cx="125" cy="99" r="2.2" fill="#FBBF24" class="server-led-2" />
      <circle cx="125" cy="109" r="2.2" fill="#FBBF24" class="server-led-1" />
      <text x="153" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FDE68A">GATEWAY</text>

      <!-- Node 3: GPU SERVING -->
      <rect x="224" y="54" width="74" height="32" rx="4" fill="#1F0E04" stroke="#FBBF24" stroke-width="1.2" />
      <circle cx="237" cy="70" r="3" fill="#FBBF24" filter="url(#m-glow)" class="server-led-3" />
      <text x="263" y="74" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FDE68A">GPU-POD</text>

      <!-- Node 4: CACHE / DB -->
      <rect x="224" y="122" width="74" height="32" rx="4" fill="#170902" stroke="#D97706" stroke-width="1.2" />
      <circle cx="237" cy="138" r="3" fill="#D97706" class="server-led-2" />
      <text x="263" y="142" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FCD34D">REDIS</text>
    </g>

    <!-- Rotating Server Turbine / Gear -->
    <g transform="translate(360, 104)">
      <circle cx="0" cy="0" r="36" fill="#0E0702" stroke="#4D2808" stroke-width="1" />
      <g class="gear-spin">
        <circle cx="0" cy="0" r="32" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="14, 7, 4, 7" />
        <circle cx="0" cy="0" r="22" fill="#140A02" stroke="#4D2808" stroke-width="1" />
        <!-- Gear Teeth -->
        <line x1="-32" y1="0" x2="32" y2="0" stroke="#F59E0B" stroke-width="2" />
        <line x1="0" y1="-32" x2="0" y2="32" stroke="#F59E0B" stroke-width="2" />
        <line x1="-22" y1="-22" x2="22" y2="22" stroke="#F59E0B" stroke-width="2" />
        <line x1="-22" y1="22" x2="22" y2="-22" stroke="#F59E0B" stroke-width="2" />
        <circle cx="0" cy="0" r="7" fill="#FBBF24" filter="url(#m-glow)" />
      </g>

      <!-- Rotating Sub-Gear -->
      <g class="gear-spin-rev">
        <circle cx="0" cy="0" r="15" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="6, 5" />
        <circle cx="0" cy="0" r="4" fill="#EF4444" />
      </g>
      <text x="0" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FDE68A">TURBINE: 48.2K</text>
    </g>

    <!-- Telemetry Footer Bar -->
    <g transform="translate(18, 188)" font-family="'JetBrains Mono', monospace" font-size="8.5">
      <text fill="#FBBF24" font-weight="700">RATE: 48.2k req/s</text>
      <text x="140" fill="#F59E0B">P99: 18ms [STEADY]</text>
      <text x="300" fill="#FDE68A">CLUSTER: ACTIVE</text>
    </g>
  </g>

  <!-- Global Laser Scanline Beam Segment (57.6% to 73.3%) -->
  <g class="global-scan-beam-mach" pointer-events="none">
    <rect width="1200" height="28" fill="url(#m-laser-beam)" />
    <line x1="0" y1="28" x2="1200" y2="28" stroke="#FBBF24" stroke-width="2" filter="url(#m-glow)" />
    <line x1="0" y1="27" x2="1200" y2="27" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
