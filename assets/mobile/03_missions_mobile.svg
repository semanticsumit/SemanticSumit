    <text x="12" y="15" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#D8B4FE">🧠 02. AUTONOMOUS SWARMS</text>
    <rect x="330" y="3" width="98" height="16" rx="3" fill="#3B0764" />
    <text x="345" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#D8B4FE">● REASONING</text>
    
    <g transform="translate(14, 40)" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">
