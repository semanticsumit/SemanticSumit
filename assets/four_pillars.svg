<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05020C" />
      <stop offset="50%" stop-color="#0D071E" />
      <stop offset="100%" stop-color="#05020A" />
    </linearGradient>

    <pattern id="p-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#251242" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <filter id="p-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .live-dot { animation: pulseDot 2s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Frame: Flat top, rounded bottom for clean zero-gap chassis finish -->
  <path d="M 0 0 L 1200 0 L 1200 636 Q 1200 650 1186 650 L 14 650 Q 0 650 0 636 Z" fill="url(#p-bg)" stroke="#2B144E" stroke-width="1.8" />
  <path d="M 0 0 L 1200 0 L 1200 636 Q 1200 650 1186 650 L 14 650 Q 0 650 0 636 Z" fill="url(#p-grid)" />

  <!-- SECTION TITLE & HEADER -->
  <g transform="translate(60, 32)">
    <text font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FBBF24" letter-spacing="1.5">
      CORE EXPERTISE · WHAT I BUILD &amp; SHIP
