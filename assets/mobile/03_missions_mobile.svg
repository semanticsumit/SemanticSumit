  <!-- Card 3: Quantum Infra -->
  <g transform="translate(20, 260)">
    <rect width="440" height="95" rx="8" fill="#080414" stroke="#F59E0B" stroke-width="1.2" />
    <rect width="440" height="22" rx="8" fill="#241406" />
    <path d="M 0 16 L 0 22 L 440 22 L 440 16 Z" fill="#241406" />
