<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0602" />
      <stop offset="50%" stop-color="#1A0D04" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <pattern id="mm-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3D200A" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <filter id="mm-glow">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="mm-laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <style>
      @keyframes pulseMach { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes spinGearSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes packetFlow { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
      @keyframes mScanMach {
        0%, 58.5% { transform: translateY(-30px); opacity: 0; }
        58.6% { transform: translateY(-10px); opacity: 1; }
        73.3% { transform: translateY(295px); opacity: 1; }
        74.3% { transform: translateY(320px); opacity: 0; }
        74.4%, 100% { transform: translateY(-30px); opacity: 0; }
      }
      .live-dot-mach { animation: pulseMach 2s infinite ease-in-out; }
      .gear-m { transform-origin: 0px 0px; animation: spinGearSlow 12s linear infinite; }
      .packet-m { stroke-dasharray: 5, 7; animation: packetFlow 1s linear infinite; }
      .m-scan-beam-mach { animation: mScanMach 8s linear infinite; }
    </style>
  </defs>

  <rect width="480" height="320" rx="8" fill="url(#mm-bg)" stroke="#F59E0B" stroke-width="1.4" />
  <rect width="480" height="320" rx="8" fill="url(#mm-grid)" />

  <!-- Content -->
  <g transform="translate(18, 30)">
    <text font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">
      ⚙️ THE MACHINE
    </text>

    <!-- Difficulty Badge -->
    <g transform="translate(170, -15)">
      <rect width="64" height="18" rx="2" fill="#2E1C0A" />
      <text x="5" y="13" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#94A3B8">DIFFICULTY</text>
      <rect x="64" y="0" width="124" height="18" rx="2" fill="#D97706" />
      <text x="70" y="13" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="800" fill="#FFFFFF">IT WORKS ON MY MACHINE</text>
    </g>

    <!-- Status Chip -->
    <g transform="translate(366, -15)">
      <rect width="74" height="18" rx="9" fill="#241406" stroke="#F59E0B" stroke-width="0.8" />
      <circle cx="10" cy="9" r="3" fill="#FBBF24" class="live-dot-mach" />
      <text x="18" y="13" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#FDE68A">SHIPPED</text>
    </g>
  </g>

  <text x="18" y="62" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="800" fill="#FB923C">
    APIs, Cloud &amp; Production Infrastructure
  </text>

  <g transform="translate(18, 84)" font-family="'JetBrains Mono', monospace" font-size="10.8" fill="#94A3B8">
    <text y="0">Scales from zero to 100K+ concurrent requests.</text>
    <text y="18">GPU serving clusters, low-latency caches &amp; queues.</text>
    <text y="36">17 moving parts pretending to be one deterministic engine.</text>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(18, 140)">
    <rect x="0" y="0" width="82" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="7" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">FastAPI / Go</text>

    <rect x="88" y="0" width="80" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="95" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Kubernetes</text>

    <rect x="174" y="0" width="76" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="181" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">GPU Serving</text>

    <rect x="256" y="0" width="74" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="263" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Postgres/pg</text>

    <rect x="336" y="0" width="84" height="20" rx="3" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
    <text x="343" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" fill="#FCD34D">Redis PubSub</text>
  </g>

  <line x1="18" y1="172" x2="462" y2="172" stroke="#3D200A" stroke-width="1" />

  <!-- Animated Pipeline for Mobile -->
  <g transform="translate(18, 185)">
    <rect width="444" height="85" rx="6" fill="#0A0401" stroke="#2E1706" stroke-width="1" />

    <!-- Microservices Pipeline Tracks -->
    <line x1="70" y1="42" x2="96" y2="42" stroke="#F59E0B" stroke-width="1.5" class="packet-m" />
    <path d="M 164 36 L 178 36 L 178 24 L 192 24" fill="none" stroke="#FBBF24" stroke-width="1.4" class="packet-m" />
    <path d="M 164 48 L 178 48 L 178 60 L 192 60" fill="none" stroke="#D97706" stroke-width="1.4" class="packet-m" />
    <path d="M 260 24 L 285 24 L 285 42 L 340 42" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- Node 1: CLIENT -->
    <rect x="10" y="27" width="60" height="30" rx="4" fill="#170902" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="20" cy="42" r="2.8" fill="#FBBF24" class="live-dot-mach" />
    <text x="44" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FDE68A">CLIENT</text>

    <!-- Node 2: GATEWAY -->
    <rect x="96" y="27" width="68" height="30" rx="4" fill="#1A0D04" stroke="#F59E0B" stroke-width="1.2" />
    <circle cx="106" cy="42" r="2.5" fill="#FBBF24" />
    <text x="137" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FDE68A">GATEWAY</text>

    <!-- Node 3: GPU-POD -->
    <rect x="192" y="11" width="68" height="26" rx="4" fill="#1F0E04" stroke="#FBBF24" stroke-width="1.2" />
    <circle cx="202" cy="24" r="2.5" fill="#FBBF24" filter="url(#mm-glow)" />
    <text x="233" y="27" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FDE68A">GPU-POD</text>

    <!-- Node 4: REDIS -->
    <rect x="192" y="47" width="68" height="26" rx="4" fill="#170902" stroke="#D97706" stroke-width="1.2" />
    <circle cx="202" cy="60" r="2.5" fill="#D97706" />
    <text x="233" y="63" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FCD34D">REDIS</text>

    <!-- Spinning Turbine Gear -->
    <g transform="translate(382, 42)">
      <g class="gear-m">
        <circle cx="0" cy="0" r="24" fill="#140A02" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="10, 6" />
        <circle cx="0" cy="0" r="6" fill="#FBBF24" filter="url(#mm-glow)" />
      </g>
      <text x="0" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#F59E0B">48.2k req/s</text>
    </g>
  </g>

  <!-- Quest & Telemetry -->
  <g transform="translate(18, 285)">
    <rect width="165" height="24" rx="4" fill="#241406" stroke="#F59E0B" stroke-width="0.9" />
    <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FBBF24">
      QUEST: SHIP THE THING
    </text>
    <text x="450" y="12" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#F59E0B">
      UPTIME: 99.98%
    </text>
    <text x="450" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">
      P99 LATENCY: &lt;45MS
    </text>
  </g>

  <!-- Global Mobile Scanline Beam Segment (58.6% to 74.3%) -->
  <g class="m-scan-beam-mach" pointer-events="none">
    <rect width="480" height="24" fill="url(#mm-laser-beam)" />
    <line x1="0" y1="24" x2="480" y2="24" stroke="#FBBF24" stroke-width="2" filter="url(#mm-glow)" />
    <line x1="0" y1="23" x2="480" y2="23" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
