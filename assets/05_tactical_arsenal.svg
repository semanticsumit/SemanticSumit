      <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#00F0FF">🐍 PYTHON [CORE]</text>

      <!-- Item 2: LiveKit -->
      <rect x="180" y="0" width="180" height="26" rx="4" fill="#14092A" stroke="#39FF14" stroke-width="0.8" />
      <text x="190" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#39FF14">🎙️ LIVEKIT / WEBRTC</text>

      <!-- Item 3: Whisper -->
      <rect x="375" y="0" width="175" height="26" rx="4" fill="#14092A" stroke="#3B82F6" stroke-width="0.8" />
      <text x="385" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#60A5FA">⚡ STREAMING WHISPER</text>

      <!-- Item 4: Maya-1 -->
      <rect x="565" y="0" width="180" height="26" rx="4" fill="#14092A" stroke="#EC4899" stroke-width="0.8" />
      <text x="575" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F472B6">🔊 MAYA-1 TTS [98ms]</text>

