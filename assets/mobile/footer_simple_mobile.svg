<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="m-f-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0602" />
      <stop offset="50%" stop-color="#1A0D04" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <linearGradient id="m-f-sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="mf-laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <filter id="m-f-glow">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="m-f-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3D200A" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <style>
      @keyframes mScanFooter {
        0%, 89.9% { transform: translateY(-30px); opacity: 0; }
        90.0% { transform: translateY(-10px); opacity: 1; }
        98.5% { transform: translateY(175px); opacity: 1; }
        100.0% { transform: translateY(200px); opacity: 0; }
      }
      .m-scan-beam-footer { animation: mScanFooter 8s linear infinite; }
    </style>
  </defs>

  <!-- Frame: Flat top, rounded bottom -->
  <path d="M 0 0 L 480 0 L 480 186 Q 480 200 466 200 L 14 200 Q 0 200 0 186 Z" fill="url(#m-f-bg)" stroke="#F59E0B" stroke-width="1.8" />
  <path d="M 0 0 L 480 0 L 480 186 Q 480 200 466 200 L 14 200 Q 0 200 0 186 Z" fill="url(#m-f-grid)" />

  <!-- Sliced Sun Center Horizon -->
  <!-- Sliced Sun Center Horizon -->
  <g transform="translate(240, 138)">
    <circle cx="0" cy="5" r="40" fill="url(#m-f-sun)" opacity="0.4" filter="url(#m-f-glow)" />
    <!-- Horizontal scan cut lines across lower sun - cleanly below copyright badge -->
    <line x1="-32" y1="24" x2="32" y2="24" stroke="#0E0602" stroke-width="2.5" />
    <line x1="-25" y1="32" x2="25" y2="32" stroke="#0E0602" stroke-width="3" />
    <line x1="-16" y1="39" x2="16" y2="39" stroke="#0E0602" stroke-width="3.5" />
  </g>

  <!-- PHILOSOPHY QUOTE & COMMAND -->
  <g transform="translate(240, 38)" text-anchor="middle">
    <!-- Quote -->
    <text font-family="'JetBrains Mono', monospace" font-size="11" font-style="italic" fill="#FDE68A">
      "Creativity is finding an unreasonable
    </text>
    <text y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-style="italic" fill="#FDE68A">
      possibility nobody looked for."
    </text>

    <!-- Terminal Command -->
    <g transform="translate(0, 52)">
      <rect x="-195" y="-15" width="390" height="28" rx="14" fill="#140702" stroke="#F59E0B" stroke-width="1.2" />
      <text y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#FBBF24" letter-spacing="0.5">
        sudo chmod +x /universe/reality &amp;&amp; ./make_it_epic.sh
      </text>
    </g>

    <!-- Copyright Horizon Badge - High Visibility -->
    <g transform="translate(0, 102)">
      <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#0E0602" fill-opacity="0.92" stroke="#F59E0B" stroke-width="1" />
      <text y="4" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#FDE68A" letter-spacing="1.5">
        © 2026 SEMANTICSUMIT
      </text>
    </g>
  </g>

  <!-- Global Mobile Scanline Beam Segment (90.0% to 100.0%) -->
  <g class="m-scan-beam-footer" pointer-events="none">
    <rect width="480" height="24" fill="url(#mf-laser-beam)" />
    <line x1="0" y1="24" x2="480" y2="24" stroke="#FBBF24" stroke-width="2" filter="url(#m-f-glow)" />
    <line x1="0" y1="23" x2="480" y2="23" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
