      <rect x="760" y="0" width="160" height="26" rx="4" fill="#200B1E" stroke="#EC4899" stroke-width="0.8" />
      <text x="770" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#F472B6">🎨 VANILLA CSS</text>

