    </text>
    <line x1="-10" y1="14" x2="450" y2="14" stroke="#251642" stroke-width="1.2" />
  </g>

  <!-- ================= 4 STACKED MISSION CARDS ================= -->
  <!-- Card 1: Maya-1 -->
  <g transform="translate(20, 50)">
    <rect width="440" height="95" rx="8" fill="#080414" stroke="#00F0FF" stroke-width="1.2" />
    <rect width="440" height="22" rx="8" fill="#120A28" />
    <path d="M 0 16 L 0 22 L 440 22 L 440 16 Z" fill="#120A28" />
    <text x="12" y="15" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#00F0FF">🎙️ 01. PROJECT MAYA-1 [VOICE AI]</text>
    <rect x="330" y="3" width="98" height="16" rx="3" fill="#052E16" />
    <text x="340" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#39FF14">● SUB-100ms LIVE</text>
    
    <g transform="translate(14, 40)" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">
      <text y="0" font-weight="700">Real-Time Streaming TTS (Apple Silicon &amp; CUDA)</text>
      <text y="18" fill="#94A3B8">• Sub-30ms first-packet audio synthesis</text>
      <text y="36" fill="#39FF14" font-weight="700">STATUS: DEPLOYED IN PRODUCTION</text>
    </g>
  </g>

  <!-- Card 2: Autonomous Swarms -->
  <g transform="translate(20, 155)">
    <rect width="440" height="95" rx="8" fill="#080414" stroke="#A855F7" stroke-width="1.2" />
    <rect width="440" height="22" rx="8" fill="#1A0C30" />
