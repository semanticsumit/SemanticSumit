<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mob-bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05020C" />
      <stop offset="50%" stop-color="#0E0820" />
      <stop offset="100%" stop-color="#04020A" />
    </linearGradient>
  </defs>

  <rect width="480" height="720" fill="url(#mob-bg-3)" stroke="#2B144E" stroke-width="1.8" />

  <!-- HEADER -->
  <g transform="translate(20, 26)">
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00F0FF" letter-spacing="1">
