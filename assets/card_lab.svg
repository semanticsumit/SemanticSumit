<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient (Machine Obsidian Amber) -->
    <linearGradient id="l-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0602" />
      <stop offset="50%" stop-color="#1A0D04" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <!-- Lab Liquid Gradient -->
    <linearGradient id="flask-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#FBBF24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.95" />
    </linearGradient>

    <!-- Synchronized Laser Scan Beam Segment -->
    <linearGradient id="l-laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <pattern id="l-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3D200A" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <filter id="l-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseLab { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
      @keyframes bubbleRise1 {
        0% { transform: translateY(0px) scale(0.6); opacity: 0; }
        25% { opacity: 0.9; }
        75% { opacity: 0.9; }
        100% { transform: translateY(-40px) scale(1.1); opacity: 0; }
      }
      @keyframes bubbleRise2 {
        0% { transform: translateY(0px) scale(0.7); opacity: 0; }
        25% { opacity: 0.9; }
        80% { opacity: 0.85; }
        100% { transform: translateY(-34px) scale(1.15); opacity: 0; }
      }
      @keyframes bubbleRise3 {
        0% { transform: translateY(0px) scale(0.5); opacity: 0; }
        30% { opacity: 0.95; }
        70% { opacity: 0.95; }
        100% { transform: translateY(-44px) scale(1.2); opacity: 0; }
      }
      @keyframes dripReagent {
        0%, 15% { transform: translateY(0px); opacity: 0; }
        25% { opacity: 1; }
        65% { transform: translateY(30px); opacity: 1; }
        70%, 100% { transform: translateY(35px); opacity: 0; }
      }
      @keyframes centrifugeSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes moleculeSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-360deg); }
      }
      @keyframes coilFlow {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes globalScanLab {
        0%, 73.2% { transform: translateY(-30px); opacity: 0; }
        73.3% { transform: translateY(-10px); opacity: 1; }
        87.9% { transform: translateY(220px); opacity: 1; }
        88.9% { transform: translateY(240px); opacity: 0; }
        89.0%, 100% { transform: translateY(-30px); opacity: 0; }
      }

      .live-dot-lab { animation: pulseLab 2s infinite ease-in-out; }
      .b-rise-1 { animation: bubbleRise1 1.8s infinite ease-in; }
      .b-rise-2 { animation: bubbleRise2 2.3s infinite ease-in; }
      .b-rise-3 { animation: bubbleRise3 1.5s infinite ease-in; }
      .drip-anim { animation: dripReagent 2.2s infinite ease-in; }
      .centrifuge-spin { transform-origin: 0px 0px; animation: centrifugeSpin 6s linear infinite; }
      .molecule-spin { transform-origin: 0px 0px; animation: moleculeSpin 10s linear infinite; }
      .coil-flow { stroke-dasharray: 8, 10; animation: coilFlow 1.4s linear infinite; }
      .global-scan-beam-lab { animation: globalScanLab 8s linear infinite; }
    </style>
  </defs>

  <!-- Card Chassis Frame -->
  <rect width="1200" height="240" rx="8" fill="url(#l-bg)" stroke="#F59E0B" stroke-width="1.4" />
  <rect width="1200" height="240" rx="8" fill="url(#l-grid)" />

  <!-- ================= LEFT COLUMN: CONTENT & SPECS ================= -->
  <g transform="translate(36, 32)">
    <!-- Header: Title + Difficulty Badge + Status -->
    <text font-family="'Inter', -apple-system, sans-serif" font-size="21" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      🧪 THE LAB
    </text>

    <!-- Difficulty Badge -->
    <g transform="translate(170, -17)">
      <rect width="75" height="20" rx="3" fill="#2E1C0A" />
      <text x="6" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#94A3B8">DIFFICULTY</text>
      <rect x="75" y="0" width="95" height="20" rx="3" fill="#D97706" />
      <text x="82" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" font-weight="800" fill="#FFFFFF">UNDEFINED</text>
    </g>

    <!-- Status Pill -->
    <g transform="translate(365, -17)">
      <rect width="92" height="20" rx="10" fill="#241406" stroke="#F59E0B" stroke-width="0.8" />
      <circle cx="12" cy="10" r="3.5" fill="#FBBF24" class="live-dot-lab" />
      <text x="22" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" font-weight="800" fill="#FDE68A">EXPLORING</text>
    </g>

    <!-- Subtitle -->
    <text y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#FB923C" letter-spacing="0.3">
      Autonomous Swarms, Novel Tools &amp; 0-to-1 R&amp;D
    </text>

    <!-- Well-Defined Description -->
    <g transform="translate(0, 54)" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#94A3B8">
      <text y="0">Turning raw exploratory research into <tspan fill="#F8FAFC" font-weight="700">commercial market defensibility</tspan>.</text>
      <text y="19">Autonomous multi-agent loops, self-correcting sandboxes &amp; edge AI prototypes.</text>
      <text y="38">Weird tools, unconventional paradigms, and the occasional discovery that changes everything.</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 114)">
      <rect x="0" y="0" width="102" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Agent Swarms</text>

      <rect x="110" y="0" width="98" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="120" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Code Sandbox</text>

      <rect x="216" y="0" width="98" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="226" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Edge Devices</text>

      <rect x="322" y="0" width="104" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="332" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Multimodal AI</text>

      <rect x="434" y="0" width="90" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="444" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Rapid MVP</text>
    </g>

    <!-- Bottom Row: Quest & Telemetry -->
    <g transform="translate(0, 150)">
      <rect width="210" height="26" rx="4" fill="#241406" stroke="#F59E0B" stroke-width="1" />
      <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#FBBF24">
        QUEST: BREAK THE PATTERN
      </text>

      <text x="240" y="17" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F59E0B">
        STAGE: SKUNKWORKS · VELOCITY: ULTRA
      </text>
      <text x="490" y="17" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">
        0 ➔ 1 VALIDATION &amp; COMMERCIAL R&amp;D
      </text>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="720" y1="20" x2="720" y2="220" stroke="#3D200A" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- ================= RIGHT COLUMN: ANIMATED SCIENCE / R&D CYBER LAB ================= -->
  <g transform="translate(735, 18)">
    <rect width="430" height="204" rx="6" fill="#0A0401" stroke="#2E1706" stroke-width="1" />
    <rect width="430" height="20" rx="6" fill="#180A03" />
    <path d="M 0 16 L 0 20 L 430 20 L 430 16 Z" fill="#180A03" />
    <circle cx="14" cy="10" r="3" fill="#EF4444" />
    <circle cx="24" cy="10" r="3" fill="#F59E0B" />
    <circle cx="34" cy="10" r="3" fill="#10B981" />
    <text x="50" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717A">skunkworks_lab — synthesis.reagent [reactive]</text>

    <!-- ================= LAB STAGE 1: BUBBLING BOILING REACTION FLASK ================= -->
    <g transform="translate(10, 0)">
      <!-- Precision Overhead Pipette Dropper -->
      <path d="M 73 30 L 79 30 L 79 45 L 76 52 L 73 45 Z" fill="#1A0D04" stroke="#F59E0B" stroke-width="1" />
      <line x1="76" y1="30" x2="76" y2="46" stroke="#FBBF24" stroke-width="1" />
      <ellipse cx="76" cy="54" rx="2" ry="2.8" fill="#FBBF24" filter="url(#l-glow)" class="drip-anim" />

      <!-- Erlenmeyer Glass Flask Body -->
      <path d="M 67 60 L 85 60 M 70 60 L 70 88 L 44 156 Q 42 160 48 160 L 104 160 Q 110 160 108 156 L 82 88 L 82 60" fill="none" stroke="#F59E0B" stroke-width="1.8" />
      
      <!-- Flask Lip/Rim -->
      <rect x="66" y="58" width="20" height="3" rx="1.5" fill="#241406" stroke="#F59E0B" stroke-width="1" />

      <!-- Amber Reagent Fluid Fill -->
      <path d="M 54 122 Q 76 118 98 122 L 106 158 L 46 158 Z" fill="url(#flask-liquid)" />
      <path d="M 54 122 Q 76 118 98 122" fill="none" stroke="#FDE68A" stroke-width="1.5" filter="url(#l-glow)" />

      <!-- Graduation Volume Marks -->
      <line x1="86" y1="126" x2="92" y2="126" stroke="#FDE68A" stroke-width="1" opacity="0.8" />
      <text x="94" y="128" font-family="'JetBrains Mono', monospace" font-size="5.5" fill="#FDE68A">75ml</text>
      <line x1="89" y1="138" x2="95" y2="138" stroke="#FDE68A" stroke-width="1" opacity="0.8" />
      <text x="97" y="140" font-family="'JetBrains Mono', monospace" font-size="5.5" fill="#FDE68A">50ml</text>
      <line x1="93" y1="150" x2="99" y2="150" stroke="#FDE68A" stroke-width="1" opacity="0.8" />
      <text x="101" y="152" font-family="'JetBrains Mono', monospace" font-size="5.5" fill="#FDE68A">25ml</text>

      <!-- Animated Rising Reaction Bubbles -->
      <circle cx="64" cy="154" r="2.8" fill="#FDE68A" class="b-rise-1" />
      <circle cx="82" cy="155" r="3.2" fill="#FBBF24" filter="url(#l-glow)" class="b-rise-2" />
      <circle cx="73" cy="152" r="2" fill="#FFFFFF" class="b-rise-3" />
      <circle cx="91" cy="154" r="2.6" fill="#FDE68A" class="b-rise-1" />

      <!-- Laser Heating Base Plate -->
      <rect x="40" y="162" width="72" height="6" rx="2" fill="#241004" stroke="#F59E0B" stroke-width="1" />
      <line x1="46" y1="165" x2="106" y2="165" stroke="#FBBF24" stroke-width="1.8" filter="url(#l-glow)" stroke-dasharray="4, 3" />
      <text x="76" y="178" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#FDE68A">REAGENT: 0➔1</text>
    </g>

    <!-- ================= LAB STAGE 2: CONDENSER TUBE & MOLECULAR SYNTHESIS ================= -->
    <!-- Glass Transfer Condenser Tube (Connecting Flask to Centrifuge) -->
    <path d="M 92 82 L 140 82 Q 150 82 150 92 L 150 102 Q 150 112 160 112 L 200 112 Q 210 112 210 102 L 210 92 Q 210 82 220 82 L 270 82 Q 285 82 285 104 L 305 104" fill="none" stroke="#3D200A" stroke-width="5" stroke-linecap="round" />
    <path d="M 92 82 L 140 82 Q 150 82 150 92 L 150 102 Q 150 112 160 112 L 200 112 Q 210 112 210 102 L 210 92 Q 210 82 220 82 L 270 82 Q 285 82 285 104 L 305 104" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" class="coil-flow" />

    <!-- Condensation Drops in Tube -->
    <circle cx="150" cy="97" r="2.2" fill="#FDE68A" />
    <circle cx="210" cy="97" r="2.2" fill="#FBBF24" />

    <!-- 3D Rotating Molecular Hexagon / Catalyst Structure -->
    <g transform="translate(180, 62)">
      <g class="molecule-spin">
        <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#140702" stroke="#F59E0B" stroke-width="1.4" />
        <circle cx="0" cy="-18" r="3.2" fill="#FBBF24" filter="url(#l-glow)" />
        <circle cx="16" cy="-9" r="3" fill="#D97706" />
        <circle cx="16" cy="9" r="3" fill="#FBBF24" filter="url(#l-glow)" />
        <circle cx="0" cy="18" r="3.2" fill="#D97706" />
        <circle cx="-16" cy="9" r="3" fill="#FBBF24" filter="url(#l-glow)" />
        <circle cx="-16" cy="-9" r="3" fill="#D97706" />
        <circle cx="0" cy="0" r="4.5" fill="#FDE68A" />
      </g>
      <text x="0" y="28" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" fill="#FDE68A">SYNTHESIS</text>
    </g>

    <!-- ================= LAB STAGE 3: SPINNING 4-VIAL CENTRIFUGE APPARATUS ================= -->
    <g transform="translate(350, 104)">
      <!-- Chamber Enclosure -->
      <circle cx="0" cy="0" r="40" fill="#0E0702" stroke="#4D2808" stroke-width="1.2" />
      <circle cx="0" cy="0" r="36" fill="none" stroke="#3D200A" stroke-width="1" stroke-dasharray="4, 4" />

      <!-- 4 Rapid Spinning Cryo Vials / Test Tubes -->
      <g class="centrifuge-spin">
        <!-- Vial 1 (Top) -->
        <rect x="-4" y="-34" width="8" height="18" rx="3" fill="#241004" stroke="#F59E0B" stroke-width="1" />
        <rect x="-3" y="-28" width="6" height="11" rx="2" fill="#FBBF24" filter="url(#l-glow)" />

        <!-- Vial 2 (Right) -->
        <rect x="16" y="-4" width="18" height="8" rx="3" fill="#241004" stroke="#F59E0B" stroke-width="1" />
        <rect x="17" y="-3" width="11" height="6" rx="2" fill="#D97706" />

        <!-- Vial 3 (Bottom) -->
        <rect x="-4" y="16" width="8" height="18" rx="3" fill="#241004" stroke="#F59E0B" stroke-width="1" />
        <rect x="-3" y="17" width="6" height="11" rx="2" fill="#FBBF24" filter="url(#l-glow)" />

        <!-- Vial 4 (Left) -->
        <rect x="-34" y="-4" width="18" height="8" rx="3" fill="#241004" stroke="#F59E0B" stroke-width="1" />
        <rect x="-28" y="-3" width="11" height="6" rx="2" fill="#D97706" />

        <!-- Center Vortex Hub -->
        <circle cx="0" cy="0" r="9" fill="#140702" stroke="#F59E0B" stroke-width="1.2" />
        <circle cx="0" cy="0" r="4" fill="#FBBF24" filter="url(#l-glow)" />
      </g>

      <text x="0" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FDE68A">CENTRIFUGE: 12K RPM</text>
    </g>

    <!-- Telemetry Footer Bar -->
    <g transform="translate(18, 188)" font-family="'JetBrains Mono', monospace" font-size="8.5">
      <text fill="#FBBF24" font-weight="700">REACTION: CATALYTIC</text>
      <text x="140" fill="#F59E0B">TEMP: 373K [STABLE]</text>
      <text x="300" fill="#FDE68A">PURITY: 99.4% [0➔1]</text>
    </g>
  </g>

  <!-- Global Laser Scanline Beam Segment (73.3% to 88.9%) -->
  <g class="global-scan-beam-lab" pointer-events="none">
    <rect width="1200" height="28" fill="url(#l-laser-beam)" />
    <line x1="0" y1="28" x2="1200" y2="28" stroke="#FBBF24" stroke-width="2" filter="url(#l-glow)" />
    <line x1="0" y1="27" x2="1200" y2="27" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
