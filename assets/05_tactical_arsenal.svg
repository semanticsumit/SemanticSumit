      <rect x="935" y="0" width="160" height="26" rx="4" fill="#200B1E" stroke="#A855F7" stroke-width="0.8" />
      <text x="945" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#D8B4FE">🐘 PHP / LARAVEL</text>
