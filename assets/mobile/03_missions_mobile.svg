      <rect x="210" y="0" width="195" height="32" rx="4" fill="#120826" stroke="#39FF14" stroke-width="0.8" />
      <text x="222" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#39FF14">🎙️ LiveKit / WebRTC</text>
