<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="marquee-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E0A3C" />
      <stop offset="25%" stop-color="#3B0764" />
      <stop offset="50%" stop-color="#701A75" />
      <stop offset="75%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#1E0A3C" />
    </linearGradient>

    <linearGradient id="text-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <filter id="m-glow">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes blinkLights {
        0%, 100% { opacity: 1; fill: #00F0FF; }
        33% { opacity: 0.3; fill: #EC4899; }
        66% { opacity: 1; fill: #FBBF24; }
      }
      @keyframes blinkText {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.2; }
      }
      .bulb-1 { animation: blinkLights 1.5s infinite; }
      .bulb-2 { animation: blinkLights 1.5s infinite 0.5s; }
      .bulb-3 { animation: blinkLights 1.5s infinite 1s; }
      .flash-text { animation: blinkText 1.2s infinite; }
    </style>
  </defs>

  <rect width="1000" height="90" rx="8" fill="url(#marquee-bg)" stroke="#EC4899" stroke-width="2" />

  <!-- Marquee Chaser Bulbs Top & Bottom -->
  <g fill="#00F0FF">
    <!-- Top row bulbs -->
    <circle cx="40" cy="12" r="3.5" class="bulb-1" />
    <circle cx="120" cy="12" r="3.5" class="bulb-2" />
    <circle cx="200" cy="12" r="3.5" class="bulb-3" />
    <circle cx="280" cy="12" r="3.5" class="bulb-1" />
    <circle cx="360" cy="12" r="3.5" class="bulb-2" />
    <circle cx="440" cy="12" r="3.5" class="bulb-3" />
    <circle cx="520" cy="12" r="3.5" class="bulb-1" />
    <circle cx="600" cy="12" r="3.5" class="bulb-2" />
    <circle cx="680" cy="12" r="3.5" class="bulb-3" />
    <circle cx="760" cy="12" r="3.5" class="bulb-1" />
    <circle cx="840" cy="12" r="3.5" class="bulb-2" />
    <circle cx="920" cy="12" r="3.5" class="bulb-3" />
    <circle cx="960" cy="12" r="3.5" class="bulb-1" />

    <!-- Bottom row bulbs -->
    <circle cx="40" cy="78" r="3.5" class="bulb-3" />
    <circle cx="120" cy="78" r="3.5" class="bulb-1" />
    <circle cx="200" cy="78" r="3.5" class="bulb-2" />
    <circle cx="280" cy="78" r="3.5" class="bulb-3" />
    <circle cx="360" cy="78" r="3.5" class="bulb-1" />
    <circle cx="440" cy="78" r="3.5" class="bulb-2" />
    <circle cx="520" cy="78" r="3.5" class="bulb-3" />
    <circle cx="600" cy="78" r="3.5" class="bulb-1" />
    <circle cx="680" cy="78" r="3.5" class="bulb-2" />
    <circle cx="760" cy="78" r="3.5" class="bulb-3" />
    <circle cx="840" cy="78" r="3.5" class="bulb-1" />
    <circle cx="920" cy="78" r="3.5" class="bulb-2" />
    <circle cx="960" cy="78" r="3.5" class="bulb-3" />
  </g>

  <!-- Marquee Text -->
  <text x="500" y="44" text-anchor="middle" font-family="'JetBrains Mono', 'Impact', sans-serif" font-size="20" font-weight="900" fill="url(#text-neon)" filter="url(#m-glow)" letter-spacing="4">
    🕹️ NEURAL CONTRIBUTION MATRIX // LEVEL 99 🕹️
  </text>

  <text x="500" y="64" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#39FF14" class="flash-text" letter-spacing="2">
    INSERT COIN TO CONTINUE CONSUMING COMMITS
  </text>
</svg>
