<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="v-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0602" />
      <stop offset="50%" stop-color="#1A0D04" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <linearGradient id="v-laser-beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="90%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.85" />
    </linearGradient>

    <pattern id="v-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3D200A" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <filter id="v-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseVoice { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
      @keyframes eq1 { 0%, 100% { height: 12px; y: 44px; } 50% { height: 48px; y: 8px; } }
      @keyframes eq2 { 0%, 100% { height: 38px; y: 18px; } 50% { height: 16px; y: 40px; } }
      @keyframes eq3 { 0%, 100% { height: 24px; y: 32px; } 50% { height: 54px; y: 2px; } }
      @keyframes eq4 { 0%, 100% { height: 45px; y: 11px; } 50% { height: 20px; y: 36px; } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 160; } 100% { stroke-dashoffset: 0; } }
      @keyframes radarPulse { 0% { r: 5; opacity: 1; } 100% { r: 35; opacity: 0; } }
      @keyframes globalScanVoice {
        0%, 41.9% { transform: translateY(-30px); opacity: 0; }
        42.0% { transform: translateY(-10px); opacity: 1; }
        56.6% { transform: translateY(220px); opacity: 1; }
        57.6% { transform: translateY(240px); opacity: 0; }
        57.7%, 100% { transform: translateY(-30px); opacity: 0; }
      }

      .live-dot-voice { animation: pulseVoice 2s infinite ease-in-out; }
      .bar-1 { animation: eq1 0.8s ease-in-out infinite; }
      .bar-2 { animation: eq2 0.6s ease-in-out infinite; }
      .bar-3 { animation: eq3 1.1s ease-in-out infinite; }
      .bar-4 { animation: eq4 0.7s ease-in-out infinite; }
      .audio-wave { stroke-dasharray: 8, 4; animation: waveScroll 2.5s linear infinite; }
      .radar-wave { animation: radarPulse 1.8s linear infinite; }
      .global-scan-beam-voice { animation: globalScanVoice 8s linear infinite; }
    </style>
  </defs>

  <!-- Card Chassis Frame -->
  <rect width="1200" height="240" rx="8" fill="url(#v-bg)" stroke="#F59E0B" stroke-width="1.4" />
  <rect width="1200" height="240" rx="8" fill="url(#v-grid)" />

  <!-- ================= LEFT COLUMN: CONTENT & SPECS ================= -->
  <g transform="translate(36, 32)">
    <!-- Header: Title + Difficulty Badge + Status -->
    <text font-family="'Inter', -apple-system, sans-serif" font-size="21" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
      🎙️ THE VOICE
    </text>

    <!-- Difficulty Badge -->
    <g transform="translate(180, -17)">
      <rect width="75" height="20" rx="3" fill="#2E1C0A" />
      <text x="6" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#94A3B8">DIFFICULTY</text>
      <rect x="75" y="0" width="120" height="20" rx="3" fill="#D97706" />
      <text x="82" y="14" font-family="'JetBrains Mono', monospace" font-size="8.8" font-weight="800" fill="#FFFFFF">WHY IS IT LAGGING</text>
    </g>

    <!-- Status Pill -->
    <g transform="translate(440, -17)">
      <rect width="105" height="20" rx="10" fill="#241406" stroke="#F59E0B" stroke-width="0.8" />
      <circle cx="12" cy="10" r="3.5" fill="#FBBF24" class="live-dot-voice" />
      <text x="22" y="14" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#FDE68A">VOICE TRAINED</text>
    </g>

    <!-- Subtitle -->
    <text y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#FB923C" letter-spacing="0.3">
      Real-Time Voice AI, Custom TTS Training &amp; Neural Audio
    </text>

    <!-- Well-Defined Description -->
    <g transform="translate(0, 54)" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#94A3B8">
      <text y="0">Trained custom neural voices: <tspan fill="#F8FAFC" font-weight="700">sub-100ms speech-to-speech turnaround</tspan>.</text>
      <text y="19">Full-duplex WebRTC streaming, acoustic cloning, whisper STT &amp; natural turn-taking.</text>
      <text y="38">Because waiting 3 seconds for a conversational AI reply is a personality flaw.</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 114)">
      <rect x="0" y="0" width="118" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Custom TTS Train</text>

      <rect x="126" y="0" width="102" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="136" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Streaming TTS</text>

      <rect x="236" y="0" width="105" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="246" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">WebRTC/LiveKit</text>

      <rect x="349" y="0" width="102" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="359" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Acoustic Clone</text>

      <rect x="459" y="0" width="82" height="22" rx="4" fill="#221204" stroke="#4D2808" stroke-width="0.8" />
      <text x="469" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FCD34D">Barge-in VAD</text>
    </g>

    <!-- Bottom Row: Quest & Telemetry -->
    <g transform="translate(0, 150)">
      <rect width="170" height="26" rx="4" fill="#241406" stroke="#F59E0B" stroke-width="1" />
      <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#FBBF24">
        QUEST: MAKE IT TALK
      </text>

      <text x="200" y="17" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#F59E0B">
        TTS: TRAINED CUSTOM NEURAL VOICES
      </text>
      <text x="470" y="17" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">
        STREAM: FULL-DUPLEX E2E · LATENCY: &lt;100MS
      </text>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="720" y1="20" x2="720" y2="220" stroke="#3D200A" stroke-width="1.2" stroke-dasharray="3,3" />

  <!-- ================= RIGHT COLUMN: ANIMATED AUDIO OSCILLOSCOPE & EQUALIZER ================= -->
  <g transform="translate(735, 18)">
    <rect width="430" height="204" rx="6" fill="#0A0401" stroke="#2E1706" stroke-width="1" />
    <rect width="430" height="20" rx="6" fill="#180A03" />
    <path d="M 0 16 L 0 20 L 430 20 L 430 16 Z" fill="#180A03" />
    <circle cx="14" cy="10" r="3" fill="#EF4444" />
    <circle cx="24" cy="10" r="3" fill="#F59E0B" />
    <circle cx="34" cy="10" r="3" fill="#10B981" />
    <text x="50" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717A">neural_speech_stream — livekit.duplex [streaming]</text>

    <!-- 16-Band Dynamic Equalizer Visualizer -->
    <g transform="translate(25, 45)">
      <!-- Base Line -->
      <line x1="0" y1="56" x2="230" y2="56" stroke="#4D2808" stroke-width="1" />
      
      <!-- EQ Bars -->
      <rect x="5" y="30" width="8" height="26" rx="2" fill="#F59E0B" class="bar-1" />
      <rect x="19" y="15" width="8" height="41" rx="2" fill="#FBBF24" class="bar-2" />
      <rect x="33" y="10" width="8" height="46" rx="2" fill="#F59E0B" class="bar-3" />
      <rect x="47" y="25" width="8" height="31" rx="2" fill="#D97706" class="bar-4" />
      <rect x="61" y="5" width="8" height="51" rx="2" fill="#FBBF24" filter="url(#v-glow)" class="bar-1" />
      <rect x="75" y="20" width="8" height="36" rx="2" fill="#F59E0B" class="bar-3" />
      <rect x="89" y="10" width="8" height="46" rx="2" fill="#FBBF24" class="bar-2" />
      <rect x="103" y="28" width="8" height="28" rx="2" fill="#D97706" class="bar-4" />
      <rect x="117" y="18" width="8" height="38" rx="2" fill="#F59E0B" class="bar-1" />
      <rect x="131" y="8" width="8" height="48" rx="2" fill="#FBBF24" filter="url(#v-glow)" class="bar-3" />
      <rect x="145" y="22" width="8" height="34" rx="2" fill="#FDE68A" class="bar-2" />
      <rect x="159" y="35" width="8" height="21" rx="2" fill="#D97706" class="bar-4" />
      <rect x="173" y="12" width="8" height="44" rx="2" fill="#F59E0B" class="bar-1" />
      <rect x="187" y="26" width="8" height="30" rx="2" fill="#FBBF24" class="bar-3" />
      <rect x="201" y="16" width="8" height="40" rx="2" fill="#FDE68A" class="bar-2" />
      <rect x="215" y="32" width="8" height="24" rx="2" fill="#D97706" class="bar-4" />
    </g>

    <!-- Real-time Sine Oscilloscope Track -->
    <g transform="translate(25, 120)">
      <path d="M 0 15 Q 25 -10 50 15 T 100 15 T 150 15 T 200 15 T 230 15" fill="none" stroke="#FBBF24" stroke-width="1.8" filter="url(#v-glow)" class="audio-wave" />
      <path d="M 0 15 Q 20 30 40 15 T 80 15 T 120 15 T 160 15 T 230 15" fill="none" stroke="#D97706" stroke-width="1.2" opacity="0.6" class="audio-wave" />
    </g>

    <!-- Radar Pulse Live Ping -->
    <g transform="translate(345, 105)">
      <circle cx="0" cy="0" r="42" fill="#0E0702" stroke="#4D2808" stroke-width="1" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.3" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#FBBF24" stroke-width="1.5" class="radar-wave" />
      <circle cx="0" cy="0" r="5" fill="#FBBF24" filter="url(#v-glow)" />
      
      <text x="0" y="55" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#FDE68A">
        PING: 84MS
      </text>
    </g>

    <!-- Telemetry Footer Bar -->
    <g transform="translate(18, 188)" font-family="'JetBrains Mono', monospace" font-size="8.5">
      <text fill="#FBBF24" font-weight="700">CODEC: OPUS 24kHz</text>
      <text x="140" fill="#F59E0B">TURNAROUND: 84ms</text>
      <text x="290" fill="#FDE68A">VAD: INSTANT BARGE-IN</text>
    </g>
  </g>

  <!-- Global Laser Scanline Beam Segment (42.0% to 57.6%) -->
  <g class="global-scan-beam-voice" pointer-events="none">
    <rect width="1200" height="28" fill="url(#v-laser-beam)" />
    <line x1="0" y1="28" x2="1200" y2="28" stroke="#FBBF24" stroke-width="2" filter="url(#v-glow)" />
    <line x1="0" y1="27" x2="1200" y2="27" stroke="#FFFFFF" stroke-width="0.8" />
  </g>
</svg>
