<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mob-bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060310" />
      <stop offset="50%" stop-color="#0E0720" />
      <stop offset="100%" stop-color="#05020D" />
    </linearGradient>

    <linearGradient id="mob-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="75%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="mob-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="mob-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#251242" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>

    <style>
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes ringSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes type1 { 0%, 5% { opacity: 0; } 15%, 100% { opacity: 1; } }
      @keyframes type2 { 0%, 35% { opacity: 0; } 45%, 100% { opacity: 1; } }
      @keyframes type3 { 0%, 65% { opacity: 0; } 75%, 100% { opacity: 1; } }
      @keyframes blinkCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .radar { transform-origin: 240px 525px; animation: radarSweep 4s linear infinite; }
      .ring { transform-origin: 240px 525px; animation: ringSpin 10s linear infinite; }
      .live-dot { animation: livePulse 1.2s infinite; }
      .cursor { animation: blinkCursor 0.9s infinite; }
    </style>
  </defs>

  <!-- Frame: Top rounded, bottom flat for zero-gap docking -->
  <path d="M 0 14 Q 0 0 14 0 L 466 0 Q 480 0 480 14 L 480 640 L 0 640 Z" fill="url(#mob-bg-1)" stroke="#2B144E" stroke-width="1.8" />
  <path d="M 0 14 Q 0 0 14 0 L 466 0 Q 480 0 480 14 L 480 640 L 0 640 Z" fill="url(#mob-grid)" />

  <!-- TOP MOBILE STATUS BAR -->
  <g transform="translate(20, 26)">
    <circle cx="0" cy="0" r="4.5" fill="#39FF14" class="live-dot" />
    <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#39FF14">
      ● MAYA-1 TTS : ONLINE
    </text>
    <text x="210" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F0FF">
      ⚡ &lt; 98ms LATENCY
    </text>
    <text x="360" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">
      INDIA // 28°N
    </text>
    <line x1="-10" y1="14" x2="450" y2="14" stroke="#251642" stroke-width="1.2" />
  </g>

  <!-- MAIN NAME & TITLE -->
  <g transform="translate(20, 75)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="38" font-weight="900" fill="url(#mob-title)" filter="url(#mob-glow)" letter-spacing="2">
      SEMANTIC SUMIT
    </text>
    
    <text y="32" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#F8FAFC">
      Architect of Real-Time Voice AI &amp; Swarms
    </text>

    <text y="54" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">
      Taking impossible ideas and shipping them to production.
    </text>

    <!-- 2x2 PILL BADGES FOR MOBILE -->
    <g transform="translate(0, 75)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="210" height="28" rx="14" fill="#0D071C" stroke="#00F0FF" stroke-width="1" />
      <text x="16" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF">🎙️ Voice AI S-Tier</text>

      <rect x="225" y="0" width="215" height="28" rx="14" fill="#0D071C" stroke="#39FF14" stroke-width="1" />
      <text x="241" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#39FF14">⚡ &lt; 98ms Pipeline</text>

      <!-- Row 2 -->
      <rect x="0" y="38" width="210" height="28" rx="14" fill="#0D071C" stroke="#A855F7" stroke-width="1" />
      <text x="16" y="56" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#D8B4FE">🧠 Agent Swarms</text>

      <rect x="225" y="38" width="215" height="28" rx="14" fill="#0D071C" stroke="#EC4899" stroke-width="1" />
      <text x="241" y="56" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F472B6">🚀 Production Ready</text>
    </g>
  </g>

  <!-- LIVE TYPING TERMINAL FOR MOBILE -->
  <g transform="translate(20, 240)">
    <rect width="440" height="150" rx="8" fill="#070410" stroke="#251642" stroke-width="1.2" />
    <rect width="440" height="24" rx="8" fill="#120824" />
    <path d="M 0 18 L 0 24 L 440 24 L 440 18 Z" fill="#120824" />
    <circle cx="14" cy="12" r="3.5" fill="#EF4444" />
    <circle cx="26" cy="12" r="3.5" fill="#F59E0B" />
    <circle cx="38" cy="12" r="3.5" fill="#10B981" />
    <text x="54" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717A">terminal.sh — sumit@cortex</text>

    <g transform="translate(16, 48)" font-family="'JetBrains Mono', monospace" font-size="11.5">
      <g style="animation: type1 8s infinite;">
        <text y="0" fill="#39FF14" font-weight="700">sumit@cortex:~$</text>
        <text x="135" y="0" fill="#F8FAFC">./stream_voice.sh</text>
      </g>
      <g style="animation: type2 8s infinite;" transform="translate(0, 24)">
        <text y="0" fill="#00F0FF">[READY]</text>
        <text x="65" y="0" fill="#E2E8F0">WebRTC Opus (48kHz Stereo)</text>
      </g>
      <g style="animation: type2 8s infinite;" transform="translate(0, 44)">
        <text y="0" fill="#A855F7">STT 32ms | LLM 38ms | TTS 16ms</text>
      </g>
      <g style="animation: type3 8s infinite;" transform="translate(0, 68)">
        <text y="0" fill="#39FF14">"Creativity is finding an impossible</text>
        <text y="20" fill="#39FF14"> possibility nobody looked for."</text>
        <rect x="290" y="8" width="7" height="13" fill="#00F0FF" class="cursor" />
      </g>
    </g>
  </g>

  <!-- HOLOGRAPHIC RADAR FOR MOBILE -->
  <g transform="translate(240, 520)">
    <circle cx="0" cy="0" r="62" fill="#090416" stroke="#251642" stroke-width="1.2" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#311854" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#00F0FF" stroke-width="0.8" opacity="0.4" />
    <circle cx="0" cy="0" r="54" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="20, 30, 10, 20" class="ring" />

    <g class="radar">
      <line x1="0" y1="0" x2="0" y2="-62" stroke="#00F0FF" stroke-width="2" filter="url(#mob-glow)" />
      <path d="M 0 0 L 22 -58 A 62 62 0 0 0 0 -62 Z" fill="#00F0FF" opacity="0.2" />
    </g>

    <circle cx="0" cy="0" r="6" fill="#00F0FF" filter="url(#mob-glow)" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    <circle cx="28" cy="-22" r="3" fill="#39FF14" />
    <circle cx="-32" cy="25" r="2.5" fill="#EC4899" />

    <text x="0" y="82" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#39FF14">
      NEURAL LOAD: 99.8% OC // LATENCY: 98ms
    </text>
  </g>

  <!-- Bottom Laser Divider -->
  <line x1="0" y1="640" x2="480" y2="640" stroke="#2B144E" stroke-width="1" />
</svg>
