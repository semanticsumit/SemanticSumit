<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="deck-chassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090614" />
      <stop offset="50%" stop-color="#110A24" />
      <stop offset="100%" stop-color="#070410" />
    </linearGradient>

    <linearGradient id="scope-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02140D" />
      <stop offset="100%" stop-color="#010A07" />
    </linearGradient>

    <linearGradient id="gold-tape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <filter id="deck-glow">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="scope-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#052E16" stroke-width="0.8" />
    </pattern>

    <style>
      @keyframes reelSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes vuBar1 { 0%, 100% { height: 12px; } 30% { height: 50px; } 70% { height: 28px; } }
      @keyframes vuBar2 { 0%, 100% { height: 35px; } 40% { height: 16px; } 80% { height: 55px; } }
      @keyframes vuBar3 { 0%, 100% { height: 22px; } 50% { height: 48px; } 85% { height: 14px; } }
      @keyframes vuBar4 { 0%, 100% { height: 45px; } 25% { height: 18px; } 65% { height: 58px; } }
      @keyframes waveScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -300; }
      }
      @keyframes ledPulse {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 4px #39FF14); }
        50% { opacity: 0.4; filter: drop-shadow(0 0 1px #39FF14); }
      }
      .spin-reel-left {
        transform-origin: 155px 155px;
        animation: reelSpin 6s linear infinite;
      }
      .spin-reel-right {
        transform-origin: 325px 155px;
        animation: reelSpin 6s linear infinite;
      }
      .vu-1 { animation: vuBar1 0.7s infinite; }
      .vu-2 { animation: vuBar2 0.85s infinite; }
      .vu-3 { animation: vuBar3 0.65s infinite; }
      .vu-4 { animation: vuBar4 0.95s infinite; }
      .osci-wave {
        stroke-dasharray: 600;
        animation: waveScroll 2.8s linear infinite;
      }
      .rec-led {
        animation: ledPulse 1s infinite;
      }
    </style>
  </defs>

  <!-- Deck Frame -->
  <rect width="1000" height="300" rx="14" fill="url(#deck-chassis)" stroke="#2B1A4A" stroke-width="2" />

  <!-- TOP DECK CONTROL BAR -->
  <g transform="translate(35, 28)">
    <circle cx="0" cy="0" r="4.5" fill="#EF4444" class="rec-led" />
    <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#EF4444" letter-spacing="1.5">
      REC // LIVE DUPLEX
    </text>
    <text x="170" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1">
      MAYA-1 HIGH-FIDELITY STREAMING TTS SYNTHESIZER
    </text>
    <text x="640" y="4" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#A855F7">
      BITRATE: 48kHz OPUS STEREO // BUFFER: 0ms
    </text>
    <rect x="910" y="-8" width="55" height="18" rx="4" fill="#052E16" stroke="#39FF14" stroke-width="0.8" />
    <text x="918" y="5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#39FF14">SYNCED</text>
    <line x1="0" y1="16" x2="930" y2="16" stroke="#23153D" stroke-width="1" />
  </g>

  <!-- ================= SECTION 1: CYBER CASSETTE MECHANISM ================= -->
  <g transform="translate(35, 60)">
    <!-- Cassette Window Glass -->
    <rect width="410" height="195" rx="8" fill="#080512" stroke="#251640" stroke-width="1.2" />
    <rect x="18" y="20" width="374" height="155" rx="6" fill="#0E0820" stroke="#7928CA" stroke-width="1" />

    <!-- Connecting Tape Bridge -->
    <path d="M 120 155 L 290 155" stroke="#451A03" stroke-width="16" opacity="0.8" />

    <!-- Left Reel at (120, 95) -->
    <g transform="translate(120, 95)">
      <circle cx="0" cy="0" r="46" fill="#1A0D30" stroke="#A855F7" stroke-width="1.5" />
      <circle cx="0" cy="0" r="32" fill="#0A0514" stroke="#00F0FF" stroke-width="1" />
      <circle cx="0" cy="0" r="14" fill="#241242" />
      <!-- Spinning Sprockets -->
      <g class="spin-reel-left" transform-origin="0 0">
        <line x1="-28" y1="0" x2="28" y2="0" stroke="#00F0FF" stroke-width="2.5" />
        <line x1="0" y1="-28" x2="0" y2="28" stroke="#00F0FF" stroke-width="2.5" />
        <line x1="-20" y1="-20" x2="20" y2="20" stroke="#EC4899" stroke-width="2" />
        <line x1="20" y1="-20" x2="-20" y2="20" stroke="#EC4899" stroke-width="2" />
      </g>
    </g>

    <!-- Right Reel at (290, 95) -->
    <g transform="translate(290, 95)">
      <circle cx="0" cy="0" r="46" fill="#1A0D30" stroke="#A855F7" stroke-width="1.5" />
      <circle cx="0" cy="0" r="32" fill="#0A0514" stroke="#00F0FF" stroke-width="1" />
      <circle cx="0" cy="0" r="14" fill="#241242" />
      <!-- Spinning Sprockets -->
      <g class="spin-reel-right" transform-origin="0 0">
        <line x1="-28" y1="0" x2="28" y2="0" stroke="#00F0FF" stroke-width="2.5" />
        <line x1="0" y1="-28" x2="0" y2="28" stroke="#00F0FF" stroke-width="2.5" />
        <line x1="-20" y1="-20" x2="20" y2="20" stroke="#EC4899" stroke-width="2" />
        <line x1="20" y1="-20" x2="-20" y2="20" stroke="#EC4899" stroke-width="2" />
      </g>
    </g>

    <!-- Cassette Center Label -->
    <rect x="175" y="65" width="60" height="40" rx="3" fill="#180B2D" stroke="#EC4899" stroke-width="0.8" />
    <text x="205" y="82" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#39FF14">98ms</text>
    <text x="205" y="96" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#94A3B8">STREAM</text>

    <!-- Tape Counter Digital HUD -->
    <rect x="18" y="148" width="80" height="20" rx="3" fill="#05030B" stroke="#00F0FF" stroke-width="0.8" />
    <text x="28" y="162" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#00F0FF">02:47</text>

    <text x="320" y="162" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A855F7">TYPE-IV METAL</text>
  </g>

  <!-- ================= SECTION 2: CRT OSCILLOSCOPE SCREEN ================= -->
  <g transform="translate(465, 60)">
    <!-- Screen Frame -->
    <rect width="320" height="195" rx="8" fill="#020C07" stroke="#052E16" stroke-width="1.8" />
    <rect width="320" height="195" rx="8" fill="url(#scope-grid)" />
    
    <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#39FF14">
      OSCILLOSCOPE // HARMONIC SPECTRUM
    </text>

    <!-- Animated Sine Oscilloscope Beam -->
    <g transform="translate(10, 100)" stroke="#39FF14" stroke-width="2" fill="none" filter="url(#deck-glow)">
      <!-- Animated Waveform -->
      <path d="M 0 0 Q 30 -60, 60 0 T 120 0 T 180 0 T 240 0 T 300 0" class="osci-wave" />
      <path d="M 0 0 Q 40 40, 80 0 T 160 0 T 240 0 T 300 0" stroke="#00F0FF" stroke-width="1.2" opacity="0.6" class="osci-wave" />
    </g>

    <text x="14" y="180" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">
      FREQ: 440Hz · Vpp: 1.42V · THD: &lt; 0.01%
    </text>
  </g>

  <!-- ================= SECTION 3: STEREO VU DANCING METERS ================= -->
  <g transform="translate(805, 60)">
    <rect width="160" height="195" rx="8" fill="#080512" stroke="#251640" stroke-width="1.2" />
    <text x="16" y="20" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#00F0FF">
      STEREO VU (dB)
    </text>

    <!-- Ch L & Ch R Meters -->
    <g transform="translate(24, 38)">
      <!-- Ch L Background & Animated Bar -->
      <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">CH L</text>
      <rect x="0" y="18" width="18" height="100" rx="3" fill="#120924" />
      <!-- Animated dynamic bar L -->
      <rect x="0" y="50" width="18" height="68" rx="3" fill="#39FF14" class="vu-1" filter="url(#deck-glow)" />

      <!-- Ch R Background & Animated Bar -->
      <text x="40" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">CH R</text>
      <rect x="40" y="18" width="18" height="100" rx="3" fill="#120924" />
      <!-- Animated dynamic bar R -->
      <rect x="40" y="40" width="18" height="78" rx="3" fill="#00F0FF" class="vu-2" filter="url(#deck-glow)" />

      <!-- dB Scale Labels -->
      <g transform="translate(70, 22)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717A">
        <text y="8" fill="#EF4444">+3dB</text>
        <text y="28" fill="#F59E0B">0dB</text>
        <text y="52" fill="#39FF14">-6dB</text>
        <text y="76" fill="#39FF14">-12dB</text>
        <text y="98" fill="#39FF14">-20dB</text>
      </g>
    </g>

    <!-- Bottom Latency Pill -->
    <rect x="14" y="160" width="132" height="22" rx="4" fill="#052E16" stroke="#39FF14" stroke-width="1" />
    <text x="24" y="175" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#39FF14">
      LATENCY: 92ms
    </text>
  </g>

  <!-- BOTTOM STATUS LINE -->
  <g transform="translate(35, 275)" font-family="'JetBrains Mono', monospace" font-size="9.5">
    <text x="0" y="0" fill="#94A3B8">
      HARDWARE ACCELERATION: <tspan fill="#39FF14" font-weight="700">MPS (APPLE SILICON) + CUDA</tspan>
    </text>
    <text x="430" y="0" fill="#94A3B8">
      CHUNK SYNTHESIS: <tspan fill="#00F0FF" font-weight="700">16ms PER 200ms AUDIO PACKET</tspan>
    </text>
    <text x="800" y="0" fill="#EC4899" font-weight="700">
      ● GLASS-TO-GLASS READY
    </text>
  </g>
</svg>
