<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06040F" />
      <stop offset="50%" stop-color="#0F0922" />
      <stop offset="100%" stop-color="#05030D" />
    </linearGradient>

    <filter id="glow-03" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid-03" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#251442" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>

    <pattern id="scope-grid-03" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#052E16" stroke-width="0.7" />
    </pattern>

    <style>
      @keyframes reelSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes vu1 { 0%, 100% { height: 14px; } 35% { height: 60px; } 75% { height: 32px; } }
      @keyframes vu2 { 0%, 100% { height: 40px; } 45% { height: 20px; } 85% { height: 65px; } }
      @keyframes photonFlow {
        0% { transform: translateX(0px); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateX(130px); opacity: 0; }
      }
      @keyframes osciScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes ledFlash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes eqPulse1 { 0%, 100% { height: 8px; y: 22px; } 50% { height: 28px; y: 2px; } }
      @keyframes eqPulse2 { 0%, 100% { height: 24px; y: 6px; } 50% { height: 10px; y: 20px; } }

      .spin-left { transform-origin: 105px 335px; animation: reelSpin 5s linear infinite; }
      .spin-right { transform-origin: 245px 335px; animation: reelSpin 5s linear infinite; }
      .vu-bar-l { animation: vu1 0.75s infinite; }
      .vu-bar-r { animation: vu2 0.85s infinite; }
      .photon-pulse { animation: photonFlow 1.3s linear infinite; }
      .wave-path { stroke-dasharray: 600; animation: osciScroll 2.8s linear infinite; }
      .flash-led { animation: ledFlash 1.1s infinite; }
      .eq1 { animation: eqPulse1 0.7s infinite; }
      .eq2 { animation: eqPulse2 0.85s infinite; }
    </style>
  </defs>

  <!-- Frame -->
  <rect width="1200" height="430" rx="14" fill="url(#bg-03)" stroke="#2B164A" stroke-width="1.8" />
  <rect width="1200" height="430" rx="14" fill="url(#grid-03)" />

  <!-- TOP HEADER -->
  <g transform="translate(45, 26)">
    <circle cx="0" cy="0" r="4.5" fill="#39FF14" class="flash-led" />
    <text x="14" y="4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#00F0FF" letter-spacing="1.5">
      REAL-TIME VOICE AI STREAMING PIPELINE // GLASS-TO-GLASS ARCHITECTURE
    </text>
    <text x="730" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A855F7">
      PROTOCOL: WEBRTC FULL-DUPLEX // MAYA-1 TTS // OPUS 48kHz
    </text>
    <rect x="1045" y="-8" width="65" height="20" rx="4" fill="#052E16" stroke="#39FF14" stroke-width="0.8" />
    <text x="1055" y="6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#39FF14">● ONLINE</text>
    <line x1="0" y1="16" x2="1110" y2="16" stroke="#251642" stroke-width="1.2" />
  </g>

  <!-- ================= TOP SECTION: 4 PIPELINE NODES ================= -->
  <!-- Conduits -->
  <g stroke="#00F0FF" stroke-width="2" opacity="0.6">
    <line x1="285" y1="115" x2="385" y2="115" stroke-dasharray="6,4" />
    <line x1="575" y1="115" x2="675" y2="115" stroke="#A855F7" stroke-dasharray="6,4" />
    <line x1="865" y1="115" x2="965" y2="115" stroke="#EC4899" stroke-dasharray="6,4" />
  </g>
  <!-- Photons -->
  <g transform="translate(285, 115)"><circle cx="0" cy="0" r="4" fill="#00F0FF" class="photon-pulse" filter="url(#glow-03)" /></g>
  <g transform="translate(575, 115)"><circle cx="0" cy="0" r="4" fill="#A855F7" class="photon-pulse" filter="url(#glow-03)" /></g>
  <g transform="translate(865, 115)"><circle cx="0" cy="0" r="4" fill="#EC4899" class="photon-pulse" filter="url(#glow-03)" /></g>

  <!-- Node 1: Audio Ingest -->
  <g transform="translate(95, 55)">
    <rect width="190" height="115" rx="8" fill="#0A0618" stroke="#00F0FF" stroke-width="1.2" />
    <rect width="190" height="22" rx="8" fill="#140D2E" />
    <path d="M 0 16 L 0 22 L 190 22 L 190 16 Z" fill="#140D2E" />
    <text x="12" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00F0FF">01 // WEBRTC INGEST</text>
    
    <!-- Mini Equalizer -->
    <g transform="translate(45, 30)" fill="#00F0FF">
      <rect x="0" y="15" width="5" height="15" rx="2" class="eq1" />
      <rect x="10" y="8" width="5" height="22" rx="2" class="eq2" />
      <rect x="20" y="12" width="5" height="18" rx="2" class="eq1" />
      <rect x="30" y="5" width="5" height="25" rx="2" class="eq2" />
      <rect x="40" y="14" width="5" height="16" rx="2" class="eq1" />
      <rect x="50" y="6" width="5" height="24" rx="2" class="eq2" />
      <rect x="60" y="10" width="5" height="20" rx="2" class="eq1" />
      <rect x="70" y="16" width="5" height="14" rx="2" class="eq2" />
      <rect x="80" y="4" width="5" height="26" rx="2" class="eq1" />
    </g>
    <text x="12" y="88" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F8FAFC">Opus 48kHz Stereo</text>
    <rect x="12" y="94" width="166" height="14" rx="2" fill="#052E16" />
    <text x="50" y="104" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#39FF14">INGEST: ~12ms</text>
  </g>

  <!-- Node 2: Streaming STT -->
  <g transform="translate(385, 55)">
    <rect width="190" height="115" rx="8" fill="#0A0618" stroke="#3B82F6" stroke-width="1.2" />
    <rect width="190" height="22" rx="8" fill="#121438" />
    <path d="M 0 16 L 0 22 L 190 22 L 190 16 Z" fill="#121438" />
    <text x="12" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#60A5FA">02 // STREAMING STT</text>
    
    <g transform="translate(14, 34)" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#60A5FA">
      <text y="10">&gt; vad.detect: ACTIVE</text>
      <text y="22">&gt; chunk_decode(20ms)</text>
      <text y="34" fill="#39FF14">&gt; token_stream: EMIT</text>
    </g>
    <text x="12" y="88" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F8FAFC">Whisper Stream</text>
    <rect x="12" y="94" width="166" height="14" rx="2" fill="#172554" />
    <text x="55" y="104" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#60A5FA">TTFT: ~32ms</text>
  </g>

  <!-- Node 3: LLM Agent -->
  <g transform="translate(675, 55)">
    <rect width="190" height="115" rx="8" fill="#0A0618" stroke="#A855F7" stroke-width="1.2" />
    <rect width="190" height="22" rx="8" fill="#1E0E38" />
    <path d="M 0 16 L 0 22 L 190 22 L 190 16 Z" fill="#1E0E38" />
    <text x="12" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#D8B4FE">03 // COGNITIVE CORE</text>
    
    <!-- Synapse Dot -->
    <g transform="translate(95, 48)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#A855F7" stroke-width="1.2" stroke-dasharray="4,2" />
      <circle cx="0" cy="0" r="6" fill="#A855F7" filter="url(#glow-03)" />
    </g>
    <text x="12" y="88" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F8FAFC">Reasoning &amp; RAG Agent</text>
    <rect x="12" y="94" width="166" height="14" rx="2" fill="#3B0764" />
    <text x="45" y="104" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#D8B4FE">LLM-TTFT: ~38ms</text>
  </g>

  <!-- Node 4: Maya-1 TTS -->
  <g transform="translate(965, 55)">
    <rect width="190" height="115" rx="8" fill="#0A0618" stroke="#EC4899" stroke-width="1.2" />
    <rect width="190" height="22" rx="8" fill="#280C22" />
    <path d="M 0 16 L 0 22 L 190 22 L 190 16 Z" fill="#280C22" />
    <text x="12" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F472B6">04 // MAYA-1 TTS</text>
    
    <g transform="translate(30, 48)" stroke="#EC4899" stroke-width="1.8" fill="none">
      <path d="M 0 6 Q 16 -12, 32 6 T 64 6 T 96 6 T 128 6" />
    </g>
    <text x="12" y="88" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F8FAFC">Streaming Synthesis</text>
    <rect x="12" y="94" width="166" height="14" rx="2" fill="#500724" />
    <text x="50" y="104" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#F472B6">SYNTH: ~16ms</text>
  </g>

  <!-- ================= BOTTOM SECTION: CYBER CASSETTE + OSCILLOSCOPE ================= -->
  <g transform="translate(45, 190)">
    <!-- Sub-Chassis -->
    <rect width="1110" height="215" rx="10" fill="#080514" stroke="#251642" stroke-width="1.4" />

    <!-- CASSETTE PLAYER (LEFT) -->
    <g transform="translate(25, 20)">
      <rect width="320" height="175" rx="8" fill="#0B061A" stroke="#7928CA" stroke-width="1" />
      <path d="M 80 140 L 240 140" stroke="#451A03" stroke-width="14" opacity="0.8" />
      
      <!-- Reel 1 -->
      <g transform="translate(80, 85)">
        <circle cx="0" cy="0" r="42" fill="#16082B" stroke="#A855F7" stroke-width="1.5" />
        <circle cx="0" cy="0" r="28" fill="#0A0514" stroke="#00F0FF" stroke-width="1" />
        <circle cx="0" cy="0" r="12" fill="#241242" />
        <g class="spin-left" transform-origin="0 0">
          <line x1="-24" y1="0" x2="24" y2="0" stroke="#00F0FF" stroke-width="2.5" />
          <line x1="0" y1="-24" x2="0" y2="24" stroke="#00F0FF" stroke-width="2.5" />
        </g>
      </g>
      <!-- Reel 2 -->
      <g transform="translate(240, 85)">
        <circle cx="0" cy="0" r="42" fill="#16082B" stroke="#A855F7" stroke-width="1.5" />
        <circle cx="0" cy="0" r="28" fill="#0A0514" stroke="#00F0FF" stroke-width="1" />
        <circle cx="0" cy="0" r="12" fill="#241242" />
        <g class="spin-right" transform-origin="0 0">
          <line x1="-24" y1="0" x2="24" y2="0" stroke="#00F0FF" stroke-width="2.5" />
          <line x1="0" y1="-24" x2="0" y2="24" stroke="#00F0FF" stroke-width="2.5" />
        </g>
      </g>

      <rect x="135" y="60" width="50" height="34" rx="3" fill="#180B2D" stroke="#EC4899" stroke-width="0.8" />
      <text x="160" y="76" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="800" fill="#39FF14">98ms</text>
      <text x="160" y="88" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#94A3B8">STREAM</text>

      <rect x="15" y="140" width="70" height="18" rx="3" fill="#05030B" stroke="#00F0FF" stroke-width="0.8" />
      <text x="25" y="153" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" fill="#00F0FF">02:47</text>
      <text x="235" y="153" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A855F7">MAYA-1 CASSETTE</text>
    </g>

    <!-- OSCILLOSCOPE (CENTER) -->
    <g transform="translate(370, 20)">
      <rect width="450" height="175" rx="8" fill="#020C07" stroke="#052E16" stroke-width="1.8" />
      <rect width="450" height="175" rx="8" fill="url(#scope-grid-03)" />
      <text x="16" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#39FF14">
        CRT OSCILLOSCOPE // REAL-TIME SPEECH HARMONICS
      </text>
      <g transform="translate(15, 95)" stroke="#39FF14" stroke-width="2" fill="none" filter="url(#glow-03)">
        <path d="M 0 0 Q 35 -65, 70 0 T 140 0 T 210 0 T 280 0 T 350 0 T 420 0" class="wave-path" />
        <path d="M 0 0 Q 45 45, 90 0 T 180 0 T 270 0 T 360 0 T 420 0" stroke="#00F0FF" stroke-width="1.2" opacity="0.6" class="wave-path" />
      </g>
      <text x="16" y="162" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">
        CENTER FREQ: 440Hz · Vpp: 1.42V · SAMPLING: 48,000 SPS
      </text>
    </g>

    <!-- STEREO VU METERS & LATENCY (RIGHT) -->
    <g transform="translate(845, 20)">
      <rect width="240" height="175" rx="8" fill="#0B061A" stroke="#251642" stroke-width="1.2" />
      <text x="16" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00F0FF">
        STEREO VU (dB)
      </text>

      <g transform="translate(30, 32)">
        <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">CH L</text>
        <rect x="0" y="16" width="22" height="75" rx="3" fill="#120924" />
        <rect x="0" y="38" width="22" height="53" rx="3" fill="#39FF14" class="vu-bar-l" filter="url(#glow-03)" />

        <text x="50" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">CH R</text>
        <rect x="50" y="16" width="22" height="75" rx="3" fill="#120924" />
        <rect x="50" y="26" width="22" height="65" rx="3" fill="#00F0FF" class="vu-bar-r" filter="url(#glow-03)" />

        <g transform="translate(90, 20)" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717A">
          <text y="8" fill="#EF4444">+3dB</text>
          <text y="24" fill="#F59E0B">0dB</text>
          <text y="44" fill="#39FF14">-6dB</text>
          <text y="64" fill="#39FF14">-18dB</text>
        </g>
      </g>

      <rect x="16" y="138" width="208" height="24" rx="4" fill="#052E16" stroke="#39FF14" stroke-width="1" />
      <text x="120" y="154" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#39FF14">
        ⚡ GLASS-TO-GLASS: 98ms
      </text>
    </g>
  </g>
</svg>
