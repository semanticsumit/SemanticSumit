<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06030F" />
      <stop offset="50%" stop-color="#0D071D" />
      <stop offset="100%" stop-color="#04020A" />
    </linearGradient>

    <filter id="glow-07">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg-07)" stroke="#2B164A" stroke-width="1.8" />

  <!-- HEADER BAR -->
  <g transform="translate(45, 26)">
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#EF4444" letter-spacing="1.5">
      🚨 GLITCH ZONE // DEFINITELY NOT A BUG (KERNEL PANIC RECORD)
    </text>
    <text x="680" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A855F7">
      INCIDENT ID: 0xCAFE // SCOPE_CREEP_DETECTED // STATUS: RESOLVED
    </text>
    <line x1="0" y1="16" x2="1110" y2="16" stroke="#251642" stroke-width="1.2" />
  </g>

  <!-- TERMINAL CHASSIS -->
  <g transform="translate(45, 55)">
    <rect width="1110" height="200" rx="8" fill="#070410" stroke="#7928CA" stroke-width="1.2" />
    <!-- Titlebar -->
    <rect width="1110" height="26" rx="8" fill="#130826" />
    <path d="M 0 20 L 0 26 L 1110 26 L 1110 20 Z" fill="#130826" />
    <circle cx="16" cy="13" r="3.5" fill="#EF4444" />
    <circle cx="28" cy="13" r="3.5" fill="#F59E0B" />
    <circle cx="40" cy="13" r="3.5" fill="#10B981" />
    <text x="58" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#71717A">
      panic.log — 02:47:13 AM IST (Auto-recorded by Cortex Daemon)
    </text>

    <!-- Terminal Lines -->
    <g transform="translate(20, 50)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text y="0" fill="#39FF14" font-weight="700">+ [02:47:13 AM] IDEA_DETECTED   : "What if voice agents answered before you finished speaking?"</text>
      <text y="20" fill="#EF4444">- [02:47:15 AM] ESTIMATED_SCOPE : "Should take about 45 minutes of quick tinkering."</text>
      <text y="40" fill="#FBBF24">! [03:12:44 AM] REALITY_CHECK   : 64 browser tabs open, CUDA drivers compiling in terminal 3</text>
      <text y="60" fill="#FBBF24">! [03:45:00 AM] COFFEE_SUPPLY   : Depleted. Emergency green tea protocol engaged.</text>
      <text y="80" fill="#EF4444">- [04:18:22 AM] ORIGINAL_BUG    : Completely forgotten. Replaced with much cooler problem.</text>
      <text y="100" fill="#39FF14" font-weight="700">+ [04:59:10 AM] NEW_DISCOVERY   : Accidentally shaved 40ms off audio packet pipeline.</text>
      <text y="120" fill="#00F0FF" font-weight="800">+ [05:01:00 AM] STATUS          : WE ARE SO INCREDIBLY BACK. SHIP IT TO PRODUCTION.</text>
    </g>

    <!-- Bottom Status Badges -->
    <g transform="translate(20, 168)">
      <rect x="0" y="0" width="220" height="22" rx="3" fill="#3B0720" stroke="#EF4444" stroke-width="0.8" />
      <text x="14" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FCA5A5">EXPECTATION: 45 MINUTES</text>

      <rect x="235" y="0" width="230" height="22" rx="3" fill="#3B0764" stroke="#A855F7" stroke-width="0.8" />
      <text x="249" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#E9D5FF">REALITY: ENTIRE WEEKEND</text>

      <rect x="480" y="0" width="250" height="22" rx="3" fill="#052E16" stroke="#39FF14" stroke-width="0.8" />
      <text x="494" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#86EFAC">OUTCOME: ABSOLUTE TRIUMPH</text>
    </g>
  </g>
</svg>
