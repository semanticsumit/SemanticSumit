<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070512" />
      <stop offset="50%" stop-color="#0F0922" />
      <stop offset="100%" stop-color="#060410" />
    </linearGradient>

    <linearGradient id="bar-green-06" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="bar-cyan-06" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="bar-purple-06" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="glow-06" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes gaugeSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes gaugeSpinRev { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
      .g-spin { transform-origin: 105px 95px; animation: gaugeSpin 10s linear infinite; }
      .g-spin-rev { transform-origin: 105px 95px; animation: gaugeSpinRev 16s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="310" rx="14" fill="url(#bg-06)" stroke="#27184A" stroke-width="1.8" />

  <!-- HEADER -->
  <g transform="translate(45, 26)">
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#00F0FF" letter-spacing="1.5">
      // SYSTEM_VITALS &amp; OPERATIONAL_TELEMETRY HUD
    </text>
    <text x="680" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A855F7">
      DIAGNOSTIC MATRIX // TICK_RATE: 1000Hz // REALITY_SYNCHRONIZED
    </text>
    <line x1="0" y1="16" x2="1110" y2="16" stroke="#251642" stroke-width="1.2" />
  </g>

  <!-- ================= COL 1: NEURAL CAPACITY DIAL ================= -->
  <g transform="translate(45, 55)">
    <rect width="340" height="230" rx="8" fill="#0A0618" stroke="#2B1A4C" stroke-width="1" />
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00F0FF">
      01 // NEURAL CAPACITY DIAL
    </text>
    <line x1="18" y1="32" x2="322" y2="32" stroke="#21143D" stroke-width="0.8" />

    <!-- Center Dial at (170, 125) -->
    <g transform="translate(65, 30)">
      <circle cx="105" cy="95" r="65" fill="none" stroke="#20133A" stroke-width="7" />
      <circle cx="105" cy="95" r="65" fill="none" stroke="#00F0FF" stroke-width="7" stroke-dasharray="320, 90" stroke-linecap="round" filter="url(#glow-06)" />
      <circle cx="105" cy="95" r="48" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="15, 20, 35, 10" class="g-spin" />
      <circle cx="105" cy="95" r="38" fill="none" stroke="#EC4899" stroke-width="1" stroke-dasharray="10, 30" class="g-spin-rev" />

      <text x="105" y="90" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="900" fill="#FFFFFF">99.8%</text>
      <text x="105" y="108" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#39FF14" font-weight="700">OPTIMAL</text>
    </g>

    <text x="24" y="210" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">
      STATUS: <tspan fill="#39FF14" font-weight="700">OVERCLOCKED</tspan> | CORE TEMP: <tspan fill="#00F0FF">42°C</tspan>
    </text>
  </g>

  <!-- ================= COL 2: MENTAL LOAD & ENGINE GAUGES ================= -->
  <g transform="translate(410, 55)">
    <rect width="440" height="230" rx="8" fill="#0A0618" stroke="#2B1A4C" stroke-width="1" />
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#A855F7">
      02 // MENTAL LOAD &amp; ENGINE GAUGES
    </text>
    <line x1="18" y1="32" x2="422" y2="32" stroke="#21143D" stroke-width="0.8" />

    <g transform="translate(20, 52)" font-family="'JetBrains Mono', monospace" font-size="10">
      <!-- Metric 1: Coffee -->
      <text x="0" y="0" fill="#E2E8F0">COFFEE TO CODE CONVERSION</text>
      <text x="350" y="0" fill="#39FF14" font-weight="700">100%</text>
      <rect x="0" y="6" width="395" height="8" rx="4" fill="#1C1433" />
      <rect x="0" y="6" width="395" height="8" rx="4" fill="url(#bar-green-06)" />

      <!-- Metric 2: Latency -->
      <text x="0" y="32" fill="#E2E8F0">LATENCY INTOLERANCE (SUB-100MS)</text>
      <text x="350" y="32" fill="#00F0FF" font-weight="700">99.2%</text>
      <rect x="0" y="38" width="395" height="8" rx="4" fill="#1C1433" />
      <rect x="0" y="38" width="388" height="8" rx="4" fill="url(#bar-cyan-06)" />

      <!-- Metric 3: Tabs -->
      <text x="0" y="64" fill="#E2E8F0">ACTIVE BROWSER TABS HOARDED</text>
      <text x="350" y="64" fill="#EC4899" font-weight="700">64 TABS</text>
      <rect x="0" y="70" width="395" height="8" rx="4" fill="#1C1433" />
      <rect x="0" y="70" width="340" height="8" rx="4" fill="url(#bar-purple-06)" />

      <!-- Metric 4: 3AM Risk -->
      <text x="0" y="96" fill="#E2E8F0">"HEAR ME OUT" EXPERIMENTAL AMBITION</text>
      <text x="350" y="96" fill="#FACC15" font-weight="700">CRITICAL</text>
      <rect x="0" y="102" width="395" height="8" rx="4" fill="#1C1433" />
      <rect x="0" y="102" width="375" height="8" rx="4" fill="url(#bar-cyan-06)" />

      <!-- Metric 5: Shipping -->
      <text x="0" y="128" fill="#E2E8F0">VELOCITY FROM IDEA TO PRODUCTION</text>
      <text x="350" y="128" fill="#34D399" font-weight="700">INSTANT</text>
      <rect x="0" y="134" width="395" height="8" rx="4" fill="#1C1433" />
      <rect x="0" y="134" width="390" height="8" rx="4" fill="url(#bar-green-06)" />
    </g>
  </g>

  <!-- ================= COL 3: COMBAT TIERS ================= -->
  <g transform="translate(870, 55)">
    <rect width="285" height="230" rx="8" fill="#0A0618" stroke="#2B1A4C" stroke-width="1" />
    <text x="18" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#EC4899">
      03 // COMBAT LOADOUT TIERS
    </text>
    <line x1="18" y1="32" x2="267" y2="32" stroke="#21143D" stroke-width="0.8" />

    <g transform="translate(18, 48)" font-family="'JetBrains Mono', monospace" font-size="10.5">
      <rect x="0" y="0" width="249" height="28" rx="4" fill="#16082B" stroke="#7928CA" stroke-width="0.8" />
      <text x="10" y="18" fill="#E2E8F0">VOICE AI &amp; AUDIO</text>
      <text x="185" y="18" fill="#39FF14" font-weight="700">[S-TIER]</text>

      <rect x="0" y="36" width="249" height="28" rx="4" fill="#16082B" stroke="#7928CA" stroke-width="0.8" />
      <text x="10" y="54" fill="#E2E8F0">LLM AGENT SWARMS</text>
      <text x="185" y="54" fill="#00F0FF" font-weight="700">[S-TIER]</text>

      <rect x="0" y="72" width="249" height="28" rx="4" fill="#16082B" stroke="#7928CA" stroke-width="0.8" />
      <text x="10" y="90" fill="#E2E8F0">FASTAPI &amp; PYTHON</text>
      <text x="185" y="90" fill="#F472B6" font-weight="700">[MAXED]</text>

      <rect x="0" y="108" width="249" height="28" rx="4" fill="#16082B" stroke="#7928CA" stroke-width="0.8" />
      <text x="10" y="126" fill="#E2E8F0">DOCKER &amp; LINUX</text>
      <text x="185" y="126" fill="#FACC15" font-weight="700">[HARDENED]</text>

      <rect x="0" y="144" width="249" height="28" rx="4" fill="#16082B" stroke="#7928CA" stroke-width="0.8" />
      <text x="10" y="162" fill="#E2E8F0">FULLSTACK / REACT</text>
      <text x="185" y="162" fill="#38BDF8" font-weight="700">[OVERKILL]</text>
    </g>
  </g>
</svg>
