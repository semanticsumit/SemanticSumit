<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030C" />
      <stop offset="50%" stop-color="#0E071D" />
      <stop offset="100%" stop-color="#040209" />
    </linearGradient>

    <pattern id="grid-10" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#23133B" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#bg-10)" stroke="#2B164A" stroke-width="1.8" />
  <rect width="1200" height="280" rx="14" fill="url(#grid-10)" />

  <!-- HEADER -->
  <g transform="translate(45, 26)">
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#39FF14" letter-spacing="1.5">
      🔓 RESTRICTED CLEARANCE // THE UNREASONABLE MANIFESTO
    </text>
    <text x="730" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A855F7">
      ROOT_AUTHORIZATION: GRANTED // ARCHITECT'S CREED
    </text>
    <line x1="0" y1="16" x2="1110" y2="16" stroke="#251642" stroke-width="1.2" />
  </g>

  <!-- LEFT: 5 MANIFESTO TENETS -->
  <g transform="translate(60, 65)">
    <rect width="700" height="185" rx="6" fill="#070412" stroke="#7928CA" stroke-width="1" />
    <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#00F0FF">
      FIVE RULES OF UNREASONABLE ENGINEERING:
    </text>

    <g transform="translate(20, 48)" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">
      <text y="0"><tspan fill="#39FF14" font-weight="700">01.</tspan> Most software stays inside the fence of expectations. The magic is jumping the fence.</text>
      <text y="24"><tspan fill="#39FF14" font-weight="700">02.</tspan> If an idea doesn't make a senior engineer say "why do that?", it's not ambitious enough.</text>
      <text y="48"><tspan fill="#39FF14" font-weight="700">03.</tspan> Latency is an adversary to be hunted down without mercy. Glass-to-glass speed is king.</text>
      <text y="72"><tspan fill="#39FF14" font-weight="700">04.</tspan> Don't just use the system. Question the system. Then build something wild.</text>
      <text y="96"><tspan fill="#39FF14" font-weight="700">05.</tspan> Code is not just logic; it is a digital manifestation of uncompromised curiosity.</text>
    </g>
  </g>

  <!-- RIGHT: RAW REGISTER HEX DUMP -->
  <g transform="translate(780, 65)">
    <rect width="360" height="185" rx="6" fill="#060310" stroke="#251642" stroke-width="1" />
    <rect width="360" height="22" rx="6" fill="#120822" />
    <path d="M 0 16 L 0 22 L 360 22 L 360 16 Z" fill="#120822" />
    <text x="14" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#A855F7">
      MEMORY REGISTRATION DUMP [0x00 - 0x3F]
    </text>

    <g transform="translate(14, 44)" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#39FF14">
      <text y="0">0x00: 53 45 4d 41 4e 54 49 43  SEMANTIC</text>
      <text y="18">0x08: 20 53 55 4d 49 54 20 52   SUMIT R</text>
      <text y="36">0x10: 4f 4f 54 20 41 43 43 45  OOT ACCE</text>
      <text y="54">0x18: 53 53 20 47 52 41 4e 54  SS GRANT</text>
      <text y="72">0x20: 45 44 20 2f 2f 20 4d 41  ED // MA</text>
      <text y="90">0x28: 59 41 2d 31 20 4c 49 56  YA-1 LIV</text>
      <text y="108" fill="#00F0FF">0x30: 45 20 53 54 52 45 41 4d  E STREAM</text>
      <text y="126" fill="#EC4899">0x38: 20 4f 4e 4c 49 4e 45 21   ONLINE!</text>
    </g>
  </g>
</svg>
